data:
  universe: data/universe/latest.json
  prices: data/prices
  research: data/research
  predictions: data/predictions
features:
  causal_only: true
  price_feature_basis: raw_close
  target_return_basis: raw_close
  adjusted_price_diagnostic: optional_vendor_adjustment_only
  display_price_basis: raw_close
  interval_method: conditional_quantiles_q10_q50_q90
  technical: true
  market_context: true
  fundamentals: planned
  news_ir: planned
  macro: planned
models:
  primary_candidates:
    - logistic
    - extra_trees
    - hgb
  optional_challengers:
    - lightgbm
    - xgboost
    - catboost
    - patchtst
  selection_metric: logloss
  selection_source: chronological_oos_only
  stability_penalty: 0.25
regime:
  event_gap_abs: 0.03
  event_volume_ratio: 3.0
  high_vol_vix: 30.0
  trend_price_vs_sma60_abs: 0.02
  trend_breadth_low: 0.25
  trend_breadth_high: 0.75
routing:
  hierarchy:
    - asset_class_and_regime
    - asset_class
    - regime
    - global
  min_oos_folds_scoped: 3
  min_oos_folds_asset_regime: 2
  min_training_rows_scoped: 500
  fail_closed_on_data_stressed: true
calibration:
  method: platt
  fit_inside_oos_train_only: true
release:
  frozen_holdout_required: true
  independent_leakage_audit_required: true
  reproducibility_manifest_required: true
  require_beating_baseline: true
  max_holdout_ece: 0.20
automation:
  price_batch_size: 75
  price_shards: 4
  price_max_workers: 2
  incremental_period: 10d
  initial_period: 5y
  asia_prediction_time_jst: "18:17"
  us_prediction_time_jst: "07:17"
