
name: 24H Research Marathon

on:
  workflow_dispatch:
  schedule:
    - cron: "5 0 * * *"
      timezone: "Asia/Tokyo"

permissions:
  actions: read
  contents: read

concurrency:
  group: research-marathon-v1
  cancel-in-progress: false

jobs:
  core_oos:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - name: Restore latest price state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data/prices
          for shard in 0 1 2 3; do
            PRICE_SHARD_INDEX="${shard}" python scripts/restore_latest_price_state.py
          done
      - name: Refresh official universe
        run: |
          set -euo pipefail
          python scripts/refresh_universe.py
          python scripts/universe_quality_gate.py
      - name: Update price shards
        env:
          PRICE_SHARD_COUNT: 4
          PRICE_MAX_WORKERS: 1
        run: |
          set -euo pipefail
          pids=()
          for shard in 0 1 2 3; do
            (PRICE_SHARD_INDEX="${shard}" python scripts/update_prices.py) > "data/prices/marathon_core_shard_${shard}.log" 2>&1 &
            pids+=( "$!" )
          done
          rc=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || rc=1
          done
          total_deferred=0
          for shard in 0 1 2 3; do
            cat "data/prices/marathon_core_shard_${shard}.log"
            report="data/prices/price_deferred_shard_${shard}.json"
            if [ ! -f "$report" ]; then
              echo "FAIL: missing $report"
              rc=1
              continue
            fi
            count="$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1],encoding="utf-8")).get("deferred",[]) or []))' "$report")"
            total_deferred=$((total_deferred+count))
          done
          expected="$(python -c 'import json; print(len(json.load(open("data/universe/latest.json",encoding="utf-8")).get("records",[])))')"
          python -c 'import sys; total=int(sys.argv[1]); expected=int(sys.argv[2]); ratio=total/expected if expected else 1.0; print(f"price-provider-deferred-ratio={ratio:.6f}"); raise SystemExit("FAIL: provider deferred ratio over 5%") if ratio>0.05 else None' "$total_deferred" "$expected"
          exit "$rc"
      - name: Canonicalize price store
        run: python scripts/normalize_price_store.py
      - name: Update market context
        run: python scripts/update_market_context.py
      - name: Automation preflight
        run: python scripts/automation_invariants.py
      - name: Data quality gate
        run: python scripts/data_quality_gate.py
      - name: Independent PIT audit
        run: python scripts/run_independent_leakage_audit.py
      - name: Conformal safety tests
        run: pytest -q tests/test_conformal_classification.py tests/test_routing_and_pit.py
      - name: Chronological OOS research
        run: python scripts/run_daily_research.py
      - name: Write core OOS success checkpoint
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p marathon-checkpoints
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("marathon-checkpoints/core_oos.json").write_text(json.dumps({
              "stage": "core_oos",
              "status": "success",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "head_sha": os.environ["GITHUB_SHA"],
              "research_only": True,
              "production_changed": False,
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload core evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marathon-core-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 1
          path: |
            data/research/latest_metrics.json
            data/research/leakage_audit.json
            data/research/independent_leakage_audit.json
            data/research/data_quality.json
            data/research/universe_quality.json
            data/research/market_context_quality.json
            data/research/cpcv_validation_audit.json
            data/research/v13_meta_leakage_audit.json
            data/research/ultimate_v13/**
            marathon-checkpoints/core_oos.json

  finra:
    needs: core_oos
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: FINRA parser and PIT tests
        run: pytest -q tests/test_finra_api.py tests/test_external_sources.py
      - name: Restore latest price state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data/prices
          for shard in 0 1 2 3; do
            PRICE_SHARD_INDEX="${shard}" python scripts/restore_latest_price_state.py
          done
      - name: Refresh official universe
        run: |
          set -euo pipefail
          python scripts/refresh_universe.py
          python scripts/universe_quality_gate.py
      - name: Update price shards
        env:
          PRICE_SHARD_COUNT: 4
          PRICE_MAX_WORKERS: 1
        run: |
          set -euo pipefail
          pids=()
          for shard in 0 1 2 3; do
            (PRICE_SHARD_INDEX="${shard}" python scripts/update_prices.py) > "data/prices/marathon_finra_shard_${shard}.log" 2>&1 &
            pids+=( "$!" )
          done
          rc=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || rc=1
          done
          total_deferred=0
          for shard in 0 1 2 3; do
            cat "data/prices/marathon_finra_shard_${shard}.log"
            report="data/prices/price_deferred_shard_${shard}.json"
            if [ ! -f "$report" ]; then
              echo "FAIL: missing $report"
              rc=1
              continue
            fi
            count="$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1],encoding="utf-8")).get("deferred",[]) or []))' "$report")"
            total_deferred=$((total_deferred+count))
          done
          expected="$(python -c 'import json; print(len(json.load(open("data/universe/latest.json",encoding="utf-8")).get("records",[])))')"
          python -c 'import sys; total=int(sys.argv[1]); expected=int(sys.argv[2]); ratio=total/expected if expected else 1.0; print(f"price-provider-deferred-ratio={ratio:.6f}"); raise SystemExit("FAIL: provider deferred ratio over 5%") if ratio>0.05 else None' "$total_deferred" "$expected"
          exit "$rc"
      - name: Canonicalize price store
        run: python scripts/normalize_price_store.py
      - name: Update market context
        run: python scripts/update_market_context.py
      - name: Collect FINRA research data
        run: python scripts/collect_finra_research.py
      - name: Run FINRA OOS ablation
        run: python scripts/run_finra_ablation.py
      - name: Write FINRA success checkpoint
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p marathon-checkpoints
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("marathon-checkpoints/finra.json").write_text(json.dumps({
              "stage": "finra",
              "status": "success",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "head_sha": os.environ["GITHUB_SHA"],
              "research_only": True,
              "production_changed": False,
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload FINRA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marathon-finra-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 1
          path: |
            data/research/finra_short_sale.json
            data/research/finra_short_sale_ablation.json
            marathon-checkpoints/finra.json

  treasury:
    needs: finra
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Treasury parser and PIT tests
        run: pytest -q tests/test_treasury_api.py tests/test_treasury_features.py
      - name: Restore latest price state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data/prices
          for shard in 0 1 2 3; do
            PRICE_SHARD_INDEX="${shard}" python scripts/restore_latest_price_state.py
          done
      - name: Refresh official universe
        run: |
          set -euo pipefail
          python scripts/refresh_universe.py
          python scripts/universe_quality_gate.py
      - name: Update price shards
        env:
          PRICE_SHARD_COUNT: 4
          PRICE_MAX_WORKERS: 1
        run: |
          set -euo pipefail
          pids=()
          for shard in 0 1 2 3; do
            (PRICE_SHARD_INDEX="${shard}" python scripts/update_prices.py) > "data/prices/marathon_treasury_shard_${shard}.log" 2>&1 &
            pids+=( "$!" )
          done
          rc=0
          for pid in "${pids[@]}"; do
            wait "${pid}" || rc=1
          done
          total_deferred=0
          for shard in 0 1 2 3; do
            cat "data/prices/marathon_treasury_shard_${shard}.log"
            report="data/prices/price_deferred_shard_${shard}.json"
            if [ ! -f "$report" ]; then
              echo "FAIL: missing $report"
              rc=1
              continue
            fi
            count="$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1],encoding="utf-8")).get("deferred",[]) or []))' "$report")"
            total_deferred=$((total_deferred+count))
          done
          expected="$(python -c 'import json; print(len(json.load(open("data/universe/latest.json",encoding="utf-8")).get("records",[])))')"
          python -c 'import sys; total=int(sys.argv[1]); expected=int(sys.argv[2]); ratio=total/expected if expected else 1.0; print(f"price-provider-deferred-ratio={ratio:.6f}"); raise SystemExit("FAIL: provider deferred ratio over 5%") if ratio>0.05 else None' "$total_deferred" "$expected"
          exit "$rc"
      - name: Canonicalize price store
        run: python scripts/normalize_price_store.py
      - name: Update market context
        run: python scripts/update_market_context.py
      - name: Collect Treasury curve
        run: python scripts/collect_treasury_research.py
      - name: Run Treasury OOS ablation
        run: python scripts/run_treasury_ablation.py
      - name: Write Treasury success checkpoint
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p marathon-checkpoints
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("marathon-checkpoints/treasury.json").write_text(json.dumps({
              "stage": "treasury",
              "status": "success",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "head_sha": os.environ["GITHUB_SHA"],
              "research_only": True,
              "production_changed": False,
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload Treasury evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marathon-treasury-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 1
          path: |
            data/research/treasury_curve.json
            data/research/treasury_ablation.json
            marathon-checkpoints/treasury.json

  audits:
    needs: treasury
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - name: Safety and catalog tests
        run: |
          set -euo pipefail
          pytest -q tests/test_automation_contract.py tests/test_core_safety.py tests/test_external_sources.py tests/test_cpcv_validation_audit.py tests/test_ultimate_v13.py
          python scripts/research_smoke.py
          python scripts/validate_external_sources.py
      - name: Restore latest price state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data/prices
          for shard in 0 1 2 3; do
            PRICE_SHARD_INDEX="${shard}" python scripts/restore_latest_price_state.py
          done
      - name: Refresh official universe and market context
        run: |
          set -euo pipefail
          python scripts/refresh_universe.py
          python scripts/universe_quality_gate.py
          python scripts/update_market_context.py
          python scripts/normalize_price_store.py
      - name: Independent PIT audit
        run: python scripts/run_independent_leakage_audit.py
      - name: Ultimate v13 meta-leakage audit
        run: python scripts/run_v13_meta_leakage_audit.py
      - name: Ultimate v13 adversarial robustness
        run: python scripts/run_v13_adversarial_robustness.py
      - name: CPCV validation audit
        run: python scripts/run_cpcv_validation_audit.py
      - name: SEC filing research
        run: python scripts/sec_filings_research.py
      - name: SEC filing OOS challenger
        run: python scripts/run_sec_filing_ablation.py
      - name: Write audits success checkpoint
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p marathon-checkpoints
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("marathon-checkpoints/audits.json").write_text(json.dumps({
              "stage": "audits",
              "status": "success",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "head_sha": os.environ["GITHUB_SHA"],
              "research_only": True,
              "production_changed": False,
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marathon-audits-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 1
          path: |
            data/research/independent_leakage_audit.json
            data/research/v13_meta_leakage_audit.json
            data/research/cpcv_validation_audit.json
            data/research/sec_filings_research.json
            data/research/sec_filing_ablation.json
            data/research/ultimate_v13/**
            marathon-checkpoints/audits.json

  finalize:
    needs: [core_oos, finra, treasury, audits]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: marathon-*
          path: marathon-evidence
          merge-multiple: true
      - name: Write immutable final checkpoint
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          root=Path("marathon-evidence")
          results={
              "core_oos":"${{ needs.core_oos.result }}",
              "finra":"${{ needs.finra.result }}",
              "treasury":"${{ needs.treasury.result }}",
              "audits":"${{ needs.audits.result }}",
          }
          required={
              "core_oos":[
                  "data/research/latest_metrics.json",
                  "data/research/leakage_audit.json",
                  "data/research/independent_leakage_audit.json",
                  "data/research/data_quality.json",
                  "data/research/universe_quality.json",
                  "data/research/market_context_quality.json",
                  "marathon-checkpoints/core_oos.json",
              ],
              "finra":[
                  "data/research/finra_short_sale.json",
                  "data/research/finra_short_sale_ablation.json",
                  "marathon-checkpoints/finra.json",
              ],
              "treasury":[
                  "data/research/treasury_curve.json",
                  "data/research/treasury_ablation.json",
                  "marathon-checkpoints/treasury.json",
              ],
              "audits":[
                  "data/research/independent_leakage_audit.json",
                  "data/research/v13_meta_leakage_audit.json",
                  "data/research/cpcv_validation_audit.json",
                  "marathon-checkpoints/audits.json",
              ],
          }
          missing=[]
          for lane, paths in required.items():
              if results[lane] != "success":
                  continue
              for rel in paths:
                  p=root/rel
                  if not p.is_file() or p.stat().st_size <= 0:
                      missing.append(f"{lane}:{rel}")
                      continue
                  if rel.startswith("marathon-checkpoints/"):
                      try:
                          checkpoint=json.loads(p.read_text(encoding="utf-8"))
                      except Exception:
                          missing.append(f"{lane}:{rel}:invalid_json")
                          continue
                      if checkpoint.get("status") != "success":
                          missing.append(f"{lane}:{rel}:status_not_success")
                      if checkpoint.get("research_only") is not True:
                          missing.append(f"{lane}:{rel}:research_only_contract")
                      if checkpoint.get("production_changed") is not False:
                          missing.append(f"{lane}:{rel}:production_changed_contract")
                      if str(checkpoint.get("workflow_run_id")) != str(os.environ.get("GITHUB_RUN_ID")):
                          missing.append(f"{lane}:{rel}:run_id_mismatch")
                      if checkpoint.get("head_sha") != os.environ.get("GITHUB_SHA"):
                          missing.append(f"{lane}:{rel}:sha_mismatch")

          mutation_files=[]
          for p in sorted(root.rglob("*.json")) if root.exists() else []:
              try:
                  obj=json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if isinstance(obj,dict) and obj.get("production_changed") is True:
                  mutation_files.append(str(p.relative_to(root)))

          status="COMPLETED" if all(v=="success" for v in results.values()) and not missing and not mutation_files else "PARTIAL_OR_BLOCKED"
          payload={
              "schema_version":1,
              "status":status,
              "research_only":True,
              "production_changed":False,
              "github_run_id":int(os.environ["GITHUB_RUN_ID"]),
              "github_sha":os.environ["GITHUB_SHA"],
              "lane_results":results,
              "missing_required_evidence":missing,
              "production_mutation_evidence":mutation_files,
          }
          out=Path("marathon-final-checkpoint.json")
          out.write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(payload,indent=2,sort_keys=True))
          if status != "COMPLETED":
              raise SystemExit("FAIL: 24H final checkpoint is not complete")
          PY
      - name: Upload final checkpoint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marathon-final-checkpoint-${{ github.run_id }}
          path: marathon-final-checkpoint.json
          if-no-files-found: error
          retention-days: 1
      - name: Build marathon summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("marathon-evidence")
          files=sorted(root.rglob("*.json")) if root.exists() else []
          summary={
              "status":"24H_MARATHON_EVIDENCE_COLLECTED",
              "workflow_run_id": "${{ github.run_id }}",
              "head_sha": "${{ github.sha }}",
              "jobs": {
                  "core_oos": "${{ needs.core_oos.result }}",
                  "finra": "${{ needs.finra.result }}",
                  "treasury": "${{ needs.treasury.result }}",
                  "audits": "${{ needs.audits.result }}",
              },
              "json_files": [str(p.relative_to(root)) for p in files],
          }
          Path("marathon-summary.json").write_text(json.dumps(summary,indent=2),encoding="utf-8")
          print(json.dumps(summary,indent=2))
          PY
      - name: Upload marathon summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marathon-summary-${{ github.run_id }}
          retention-days: 1
          path: marathon-summary.json
      - name: Enforce lane outcomes
        if: always()
        run: |
          test "${{ needs.core_oos.result }}" = success
          test "${{ needs.finra.result }}" = success
          test "${{ needs.treasury.result }}" = success
          test "${{ needs.audits.result }}" = success
