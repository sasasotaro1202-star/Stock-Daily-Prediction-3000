name: SEC XBRL Company Facts Research

on:
  workflow_dispatch:
  schedule:
    - cron: "27 7 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: sec-companyfacts-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore latest official universe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/restore_latest_universe_state.py
          python scripts/refresh_universe.py
          python scripts/universe_quality_gate.py
      - name: Collect SEC XBRL Company Facts shard
        env:
          SEC_COMPANYFACTS_SHARD_INDEX: ${{ matrix.shard }}
          SEC_COMPANYFACTS_SHARD_COUNT: "4"
          SEC_COMPANYFACTS_MAX_ATTEMPTS: "3"
          SEC_COMPANYFACTS_SLEEP_SECONDS: "0.20"
        run: python scripts/collect_sec_companyfacts_research.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sec-companyfacts-research-${{ matrix.shard }}-${{ github.run_id }}
          path: data/research/sec_companyfacts/
          if-no-files-found: error
          retention-days: 30
