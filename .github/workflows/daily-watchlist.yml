name: Daily priority watchlist

on:
  workflow_dispatch:
  schedule:
    # Run after the canonical JP market-close cycle so the mandatory
    # priority list uses the latest completed JP session while also
    # covering the latest completed U.S. session.
    - cron: "50 18 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  actions: read
  contents: write

concurrency:
  group: daily-priority-watchlist
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore recent prediction history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/restore_prediction_history.py
      - name: Restore bounded recent official universe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ALLOW_FRESH_OFFICIAL_UNIVERSE_FALLBACK: "true"
        run: python scripts/restore_latest_universe_state.py
      - name: Restore recent canonical price state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PRICE_SHARD_COUNT: "4"
        run: python scripts/restore_latest_price_state.py
      - name: Rebuild missing price shards when restore is incomplete
        shell: bash
        run: |
          set -euo pipefail
          restore_status="$(jq -r '.status // "DEFERRED"' data/prices/price_state_restore.json 2>/dev/null || echo DEFERRED)"
          if [ "$restore_status" = "PASS" ]; then
            echo "price-state restore: all expected shards present"
          else
            echo "::warning title=Price state incomplete::restored price state is incomplete; running bounded full-universe free refresh"
            PRICE_SHARD_INDEX=0 PRICE_SHARD_COUNT=1 PRICE_MAX_WORKERS=2 python scripts/update_prices.py
          fi
      - name: Update free market context
        run: python scripts/update_market_context.py
      - name: Restore latest approved production state when available
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          restore_log="$(mktemp)"
          python scripts/restore_latest_research_state.py 2>&1 | tee "$restore_log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "approved production state restored"
          elif grep -q "DEFERRED:" "$restore_log"; then
            echo "approved production state unavailable; controlled NEAR_PRODUCTION fallback will be used"
          else
            echo "::error title=Production-state restore failed::unexpected restore error; refusing silent fallback"
            exit "$rc"
          fi
      - name: Generate latest priority equity predictions
        env:
          PREDICT_ASSET_CLASSES: jp_stock,jp_etf,jp_reit,us_stock,us_etf
        run: python scripts/run_now_prediction.py
      - name: Generate daily watchlist
        run: python scripts/generate_daily_watchlist.py
      - name: Validate daily watchlist integrity
        run: python scripts/validate_daily_watchlist.py
      - uses: actions/upload-artifact@v7
        with:
          name: daily-watchlist-${{ github.run_id }}
          path: |
            data/predictions/daily_watchlist.json
            data/predictions/daily_watchlist.md
            data/predictions/latest.parquet
            data/predictions/prediction_*.parquet
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest prediction status
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f data/predictions/daily_watchlist.json
          test -f data/predictions/daily_watchlist.md
          worktree_dir="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$worktree_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main

          if git ls-remote --exit-code --heads origin prediction-status >/dev/null 2>&1; then
            git fetch --no-tags origin prediction-status
            git worktree add --detach "$worktree_dir" origin/main
            git -C "$worktree_dir" checkout -B prediction-status origin/prediction-status
          else
            git worktree add --detach "$worktree_dir" origin/main
            git -C "$worktree_dir" checkout --orphan prediction-status
            git -C "$worktree_dir" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$worktree_dir/predictions"
          cp data/predictions/daily_watchlist.json "$worktree_dir/predictions/latest.json"
          cp data/predictions/daily_watchlist.md "$worktree_dir/predictions/latest.md"
          printf '%s\\n' "$GITHUB_SHA" > "$worktree_dir/predictions/source_commit.txt"
          printf '%s\\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" > "$worktree_dir/predictions/published_at_utc.txt"

          git -C "$worktree_dir" add predictions/latest.json predictions/latest.md predictions/source_commit.txt predictions/published_at_utc.txt
          if git -C "$worktree_dir" diff --cached --quiet; then
            echo "prediction-status: no change"
            exit 0
          fi
          git -C "$worktree_dir" commit -m "chore: publish latest daily prediction status"
          git -C "$worktree_dir" push origin HEAD:prediction-status
