name: BOJ Frontier Research

on:
  workflow_dispatch:
  schedule:
    - cron: "27 6 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: boj-frontier-research
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Collect BOJ monetary, balance-of-payments and TANKAN research data
        env:
          BOJ_FRONTIER_MAX_ATTEMPTS: "3"
        run: python scripts/collect_boj_frontier_research.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boj-frontier-research-${{ github.run_id }}
          path: data/research/boj_frontier_research.json
          if-no-files-found: error
          retention-days: 30
