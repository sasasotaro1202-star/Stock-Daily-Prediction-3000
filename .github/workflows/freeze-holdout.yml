name: Freeze and evaluate holdout

on:
  workflow_dispatch:
    inputs:
      cutoff_date:
        description: "Immutable historical cutoff date, YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/freeze_holdout.py --cutoff-date "${{ inputs.cutoff_date }}"
      - run: python scripts/run_daily_research.py
      - run: python scripts/lock_frozen_model.py
      - run: python scripts/evaluate_frozen_holdout.py
      - run: python scripts/build_manifest.py
      - name: Commit immutable freeze and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/frozen_holdout.json data/research/
          git commit -m "Freeze cutoff and evaluate holdout"
          git push
