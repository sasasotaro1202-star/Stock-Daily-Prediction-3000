name: Daily prediction research

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 1-5"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: pytest -q
      - run: python -c "print('Scaffold OK')"
