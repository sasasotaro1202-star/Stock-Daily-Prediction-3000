name: Daily prediction research

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-prediction
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - run: pytest -q
      - run: python scripts/research_smoke.py
      - name: Verify PayPay universe policy
        run: python scripts/production_invariants.py
      - run: echo "Daily stage validated; production prediction remains blocked until real data, OOS, PIT and release gates pass."
