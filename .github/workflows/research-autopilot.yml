name: Research autopilot controller

# GitHub-side autonomous Research loop.
# Expensive chronological OOS is dispatched only after current-main repository
# verification has completed successfully. This workflow owns the dispatch
# decision; Repository verification is the event-driven entry point, with a
# 30-minute schedule as a missed-trigger safety net.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
      timezone: "Asia/Tokyo"
  workflow_run:
    workflows: ["Repository verification"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: research-autopilot-controller
  cancel-in-progress: true

jobs:
  dispatch-research:
    if: >
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch Research only after current-main verification
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          verification_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/repository-verification.yml/runs?branch=main&per_page=20")"
          research_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/research-validation.yml/runs?branch=main&per_page=50")"

          verification_state="$(
            printf '%s' "$verification_runs" | jq -r --arg sha "$current_sha" '
              [ .workflow_runs[]
                | select(.head_sha == $sha)
                | select(.status == "completed")
              ]
              | sort_by(.run_number)
              | last
              | if . == null then "MISSING"
                elif .conclusion == "success" then "PASS"
                else "FAIL:" + (.conclusion // "unknown")
                end
            '
          )"

          echo "AUTOPILOT_CURRENT_MAIN_SHA=$current_sha"
          echo "AUTOPILOT_VERIFICATION_STATE=$verification_state"

          if [ "$verification_state" != "PASS" ]; then
            echo "::warning title=Research autopilot blocked::current main has no successful Repository verification; refusing expensive OOS dispatch"
            {
              echo "## Research autopilot"
              echo "- Action: \`BLOCKED_VERIFICATION\`"
              echo "- Current main: $current_sha"
              echo "- Repository verification: \`$verification_state\`"
              echo "- Research dispatch: suppressed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A Repository verification completion can be caused by a control-plane-only
          # main commit (for example the long-lived automation keepalive). Such a commit
          # must not trigger an unnecessary expensive OOS run. The normal 30-minute
          # schedule still owns the recurring research cadence.
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            latest_success_sha="$(
              printf '%s' "$research_runs" | jq -r '
                [ .workflow_runs[]
                  | select(.status == "completed" and .conclusion == "success")
                  | .head_sha
                ]
                | map(select(. != null and . != ""))
                | sort_by(.run_number)
                | map(.head_sha)
                | last // empty
              '
            )"

            if [ -n "$latest_success_sha" ] && [ "$latest_success_sha" != "$current_sha" ]; then
              compare_json="$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest_success_sha...$current_sha" 2>/dev/null || true)"
              compare_status="$(printf '%s' "$compare_json" | jq -r '.status // empty' 2>/dev/null || true)"
              compare_too_large="$(printf '%s' "$compare_json" | jq -r '.too_large // false' 2>/dev/null || echo false)"

              if [ "$compare_status" = "ahead" ] && [ "$compare_too_large" != "true" ]; then
                evidence_change=false
                while IFS= read -r changed_path; do
                  [ -n "$changed_path" ] || continue
                  case "$changed_path" in
                    pyproject.toml)
                      evidence_change=true
                      ;;
                    config/*|src/*|scripts/*)
                      case "$changed_path" in
                        scripts/automation_invariants.py|scripts/project_source_contract.py)
                          ;;
                        *)
                          evidence_change=true
                          ;;
                      esac
                      ;;
                    .github/workflows/*)
                      case "$changed_path" in
                        .github/workflows/heartbeat.yml|.github/workflows/automation-supervisor.yml|.github/workflows/actions-reliability-watchdog.yml|.github/workflows/research-autopilot.yml|.github/workflows/long-research-recovery.yml|.github/workflows/automation-failure-learning.yml|.github/workflows/research-validation-status.yml|.github/workflows/24h-research-marathon-watchdog.yml|.github/workflows/bounded-production-recovery.yml|.github/workflows/automation-activity-keepalive.yml)
                          ;;
                        *)
                          evidence_change=true
                          ;;
                      esac
                      ;;
                  esac
                  [ "$evidence_change" = true ] && break
                done < <(printf '%s' "$compare_json" | jq -r '.files[]?.filename // empty')

                if [ "$evidence_change" = false ]; then
                  echo "Repository verification changed only control-plane/non-evidence files since the last successful Research validation; suppressing push-triggered OOS dispatch"
                  {
                    echo "## Research autopilot"
                    echo "- Action: `SKIPPED_CONTROL_PLANE_ONLY`"
                    echo "- Current main: `$current_sha`"
                    echo "- Last successful Research SHA: `$latest_success_sha`"
                    echo "- Evidence-affecting changes: `false`"
                    echo "- Push-triggered Research dispatch: suppressed"
                    echo "- Recurring schedule remains responsible for the normal research cadence"
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
              else
                # Do not infer evidence freshness when GitHub's compare response is
                # unavailable/truncated. The scheduled controller will retry shortly.
                echo "::warning title=Research autopilot compare unavailable::unable to prove control-plane-only ancestry for the push-triggered verification; deferring push-triggered Research dispatch to the scheduled controller"
                {
                  echo "## Research autopilot"
                  echo "- Action: `DEFERRED_COMPARE_UNVERIFIABLE`"
                  echo "- Current main: `$current_sha`"
                  echo "- Last successful Research SHA: `$latest_success_sha`"
                  echo "- Research dispatch: deferred"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi

          active_any="$(
            printf '%s' "$research_runs" | jq '[.workflow_runs[]
              | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress")]
              | length'
          )"
          active_current="$(
            printf '%s' "$research_runs" | jq --arg sha "$current_sha" '[.workflow_runs[]
              | select(.head_sha == $sha)
              | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress")]
              | length'
          )"

          # Queued/pending runs on a superseded SHA cannot become current evidence.
          # Cancel those queue entries here; active runs remain under the watchdog's
          # evidence-fingerprint and stale-run policy.
          stale_queued_ids="$(
            printf '%s' "$research_runs" | jq -r --arg sha "$current_sha" '
              .workflow_runs[]
              | select(.head_sha != $sha)
              | select(.status == "queued" or .status == "pending")
              | .id
            '
          )"

          cancelled_stale=0
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "::warning title=Research autopilot stale queue::cancelling Research run $run_id on superseded SHA"
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"
            cancelled_stale=$((cancelled_stale + 1))
          done <<< "$stale_queued_ids"

          if [ "$active_current" -gt 0 ]; then
            echo "current-main Research run already active/queued; suppressing duplicate dispatch"
            {
              echo "## Research autopilot"
              echo "- Action: \`SKIPPED_ACTIVE\`"
              echo "- Current main: \`$current_sha\`"
              echo "- Active Research runs on current main: \`$active_current\`"
              echo "- Stale queued Research runs cancelled: \`$cancelled_stale\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          latest_success_completed_epoch="$(
            printf '%s' "$research_runs" | jq -r --arg sha "$current_sha" '
              [ .workflow_runs[]
                | select(.head_sha == $sha)
                | select(.status == "completed" and .conclusion == "success")
                | .updated_at
              ]
              | sort
              | last // empty
            ' | xargs -r -I{} date -u -d "{}" +%s
          )"

          now_epoch="$(date -u +%s)"
          recent_success=false
          if [ -n "$latest_success_completed_epoch" ] && [ "$latest_success_completed_epoch" -gt 0 ]; then
            if [ "$latest_success_completed_epoch" -ge "$((now_epoch - 24 * 60 * 60))" ]; then
              recent_success=true
            fi
          fi

          if [ "$recent_success" = true ]; then
            echo "current-main Research already has a successful validation within 24 hours"
            {
              echo "## Research autopilot"
              echo "- Action: \`SKIPPED_RECENT_SUCCESS\`"
              echo "- Current main: \`$current_sha\`"
              echo "- Recent successful Research validation: true"
              echo "- Stale queued Research runs cancelled: \`$cancelled_stale\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$active_any" -gt 0 ]; then
            # Redundant stale-run bootstrap: when any active Research validation has
            # stopped receiving Actions updates for 120 minutes, wake the watchdog.
            # The watchdog remains responsible for PIT-safe evidence comparison and
            # the actual cancel/recovery decision.
            stale_active_count="$(
              printf '%s' "$research_runs" | jq '
                [
                  .workflow_runs[]
                  | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested" or .status == "in_progress")
                  | ((.updated_at // .created_at) | fromdateiso8601) as $updated
                  | select($updated < (now - 120 * 60))
                ]
                | length
              '
            )"
            if [ "$stale_active_count" -gt 0 ]; then
              echo "::warning title=Research autopilot stale-active bootstrap::${stale_active_count} active Research run(s) have had no Actions update for over 120 minutes; waking watchdog"
              if ! gh workflow run actions-reliability-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main; then
                echo "::error title=Research autopilot stale-active bootstrap failed::unable to wake watchdog"
                exit 1
              fi
              {
                echo "## Research autopilot"
                echo "- Action: BOOTSTRAP_STALE_ACTIVE_WATCHDOG"
                echo "- Current main: $current_sha"
                echo "- Stale active Research runs: $stale_active_count"
                echo "- Watchdog recovery: DISPATCHED"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if [ "$active_any" -gt 0 ]; then
            echo "another Research validation is still active on a different SHA; watchdog owns stale/evidence invalidation"
            {
              echo "## Research autopilot"
              echo "- Action: \`SKIPPED_OLDER_ACTIVE\`"
              echo "- Current main: \`$current_sha\`"
              echo "- Active Research runs on any SHA: \`$active_any\`"
              echo "- Current-main active runs: \`$active_current\`"
              echo "- Stale queued Research runs cancelled: \`$cancelled_stale\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Dispatching Research validation from current main"
          gh workflow run research-validation.yml --repo "$GITHUB_REPOSITORY" --ref main

          {
            echo "## Research autopilot"
            echo "- Action: \`DISPATCHED\`"
            echo "- Current main: \`$current_sha\`"
            echo "- Repository verification: \`PASS\`"
            echo "- Stale queued Research runs cancelled: \`$cancelled_stale\`"
            echo "- Research validation ref: \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"