name: U.S. Treasury Rate Family Research

on:
  workflow_dispatch:
  schedule:
    - cron: "52 7 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: treasury-rate-family-research
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Collect Treasury bill, real-yield and long-term research feeds
        env:
          TREASURY_RATE_MAX_ATTEMPTS: "3"
          TREASURY_RATE_SLEEP_SECONDS: "0.20"
        run: python scripts/collect_treasury_rate_family_research.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: treasury-rate-family-research-${{ github.run_id }}
          path: data/research/treasury_rate_family/
          if-no-files-found: error
          retention-days: 30
