name: Maximum Future-Generalization v6 Reduced E2E

on:
  workflow_dispatch:
  push:
    branches:
      - research/innovative-v6-20260926
    paths:
      - "scripts/run_innovative_v6_reduced.py"
      - "scripts/meta_leakage_audit_v6.py"
      - "scripts/artifact_integrity_v6.py"
      - "scripts/promotion_gate_v6.py"
      - "scripts/report_innovative_v6.py"
      - "src/research/innovative_control_v6.py"
      - "tests/test_innovative_control_v6.py"
      - ".github/workflows/innovative-v6-reduced-e2e.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: innovative-v6-reduced-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - run: python -m compileall -q src scripts
      - run: python scripts/automation_invariants.py

  tests:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - name: V6 unit tests
        env:
          PYTHONHASHSEED: "0"
        run: pytest -q tests/test_innovative_control_v6.py
      - name: Existing conformal tests
        env:
          PYTHONHASHSEED: "0"
        run: pytest -q tests/test_conformal_classification.py

  data:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - name: Restore universe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/restore_latest_universe_state.py
          python scripts/refresh_universe.py
          python scripts/universe_quality_gate.py
      - uses: actions/upload-artifact@v7
        with:
          name: v6-reduced-universe-${{ github.run_id }}
          path: data/universe/latest.json
          retention-days: 3
      - name: Update one deterministic reduced price state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRICE_SHARD_INDEX: "0"
          PRICE_SHARD_COUNT: "1"
          PRICE_MAX_WORKERS: "2"
        run: |
          python scripts/restore_latest_price_state.py
          python scripts/update_prices.py
      - uses: actions/upload-artifact@v7
        with:
          name: v6-reduced-prices-${{ github.run_id }}
          path: data/prices/
          retention-days: 7

  reduced_e2e:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - uses: actions/download-artifact@v7
        with:
          name: v6-reduced-universe-${{ github.run_id }}
          path: data/universe
      - uses: actions/download-artifact@v7
        with:
          name: v6-reduced-prices-${{ github.run_id }}
          path: data/prices
          merge-multiple: true
      - name: Build free market context
        run: python scripts/update_market_context.py
      - name: Normalize price store
        run: python scripts/normalize_price_store.py
      - name: Data and PIT gates
        run: |
          python scripts/universe_quality_gate.py
          python scripts/data_quality_gate.py
          python scripts/run_independent_leakage_audit.py
      - name: Execute reduced chronological v6
        env:
          PYTHONHASHSEED: "0"
          V6_REDUCED_MAX_SYMBOLS: "250"
        run: python scripts/run_innovative_v6_reduced.py
      - name: Meta-leakage audit
        run: python scripts/meta_leakage_audit_v6.py
      - name: Artifact integrity
        run: python scripts/artifact_integrity_v6.py
      - name: Promotion gate
        run: python scripts/promotion_gate_v6.py
      - name: Report
        run: python scripts/report_innovative_v6.py
      - name: Upload reduced E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: innovative-v6-reduced-e2e-${{ github.run_id }}
          path: |
            data/research/latest_metrics.json
            data/research/innovative_v6_oos_bank.parquet
            data/research/leakage_audit.json
            artifacts/v6_meta_leakage_audit.json
            artifacts/v6_artifact_integrity.json
            artifacts/v6_promotion_gate.json
            artifacts/v6_report.md
          retention-days: 14

  final_status:
    needs: reduced_e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          echo "reduced_e2e_result=${{ needs.reduced_e2e.result }}"
          test "${{ needs.reduced_e2e.result }}" = "success"
