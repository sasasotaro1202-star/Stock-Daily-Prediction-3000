name: Chat request worker

on:
  workflow_run:
    workflows: ["Chat request handoff"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: chat-request-worker
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - name: Download immutable request
        uses: actions/download-artifact@v7
        with:
          name: chat-request-handoff-${{ github.event.workflow_run.id }}
          path: chat_request
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Execute asynchronously
        run: python scripts/run_chat_task.py chat_request/$(basename "$(find chat_request -type f -name '*.request.json' -print -quit)")
      - name: Upload asynchronous result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chat-task-result-${{ github.run_id }}
          path: chat_task_results/
          if-no-files-found: warn
          retention-days: 14
