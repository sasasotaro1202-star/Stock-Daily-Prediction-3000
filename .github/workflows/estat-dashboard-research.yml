name: e-Stat Dashboard Research

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: estat-dashboard-research
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Collect public e-Stat Dashboard research data
        env:
          ESTAT_REQUEST_TIMEOUT_SECONDS: 30
          ESTAT_MAX_REQUEST_ATTEMPTS: 3
        run: python scripts/collect_estat_dashboard_research.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: estat-dashboard-research-${{ github.run_id }}
          path: data/research/estat_dashboard_research.json
          if-no-files-found: error
          retention-days: 14
