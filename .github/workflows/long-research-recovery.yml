name: Long research recovery

# GitHub-side recovery for long-running research/data collectors.
# It never cancels an in-progress collector. It only:
# 1) removes stale queued/pending runs,
# 2) retries a completed failure once,
# 3) dispatches the current-main run after stale queue cleanup.
#
# The primary Research validation lane remains governed by its dedicated
# watchdog and evidence-fingerprint policy.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
      timezone: "Asia/Tokyo"

permissions:
  actions: write
  contents: read

concurrency:
  group: long-research-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Recover long research collector lanes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          now_epoch="$(date -u +%s)"
          queue_cutoff="$((now_epoch - 30 * 60))"
          recent_cutoff="$((now_epoch - 96 * 60 * 60))"

          # These workflows can legitimately run for hours. The recovery lane
          # must never cancel an in-progress run merely because it is old.
          workflows=(
            "boj-timeseries-research.yml"
            "finra-short-sale-research.yml"
            "sec-company-events-research.yml"
            "sec-companyfacts-research.yml"
            "sec-filings-research.yml"
            "sec-insider-ownership-research.yml"
            "sec-submissions-research.yml"
            "treasury-curve-research.yml"
          )

          failures=0

          for workflow_file in "${workflows[@]}"; do
            echo "=== $workflow_file ==="
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?branch=main&per_page=50")"

            active_any=false
            active_current=false
            fresh_current_queued=false
            stale_queued_ids=()

            while IFS= read -r encoded; do
              [ -n "$encoded" ] || continue
              run_json="$(printf '%s' "$encoded" | base64 -d)"
              run_id="$(printf '%s' "$run_json" | jq -r '.id // empty')"
              status="$(printf '%s' "$run_json" | jq -r '.status // empty')"
              conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // empty')"
              head_sha="$(printf '%s' "$run_json" | jq -r '.head_sha // empty')"
              created="$(printf '%s' "$run_json" | jq -r '.created_at // empty')"
              created_epoch="$(date -d "$created" +%s 2>/dev/null || echo 0)"

              [ -n "$run_id" ] || continue

              if [ "$status" = "in_progress" ]; then
                active_any=true
                if [ "$head_sha" = "$current_sha" ]; then
                  active_current=true
                fi
                # Never cancel an in-progress long collector here.
                continue
              fi

              if [ "$status" = "queued" ] || [ "$status" = "pending" ] || [ "$status" = "waiting" ] || [ "$status" = "requested" ]; then
                if [ "$head_sha" = "$current_sha" ]; then
                  if [ "$created_epoch" -gt 0 ] && [ "$created_epoch" -ge "$queue_cutoff" ]; then
                    fresh_current_queued=true
                  fi
                fi
                if [ "$created_epoch" -gt 0 ] && [ "$created_epoch" -lt "$queue_cutoff" ]; then
                  stale_queued_ids+=( "$run_id" )
                fi
                continue
              fi

              # Bounded first-failure recovery only. Attempts >= 2 are left for
              # failure-memory/research triage rather than retrying indefinitely.
              if [ "$head_sha" = "$current_sha" ]                 && [ "$status" = "completed" ]                 && { [ "$conclusion" = "failure" ] || [ "$conclusion" = "startup_failure" ] || [ "$conclusion" = "timed_out" ]; }                 && [ "$(printf '%s' "$run_json" | jq -r '.run_attempt // 1')" -lt 2 ]                 && [ "$created_epoch" -gt 0 ]                 && [ "$created_epoch" -ge "$recent_cutoff" ]; then
                echo "::warning title=$workflow_file first-failure recovery::rerunning failed run $run_id once"
                if ! gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY" --failed; then
                  echo "::error title=$workflow_file failure recovery failed::unable to rerun run $run_id"
                  failures=$((failures + 1))
                fi
                # At most one recovery action per workflow on each watchdog tick.
                fresh_current_queued=true
                break
              fi
            done < <(printf '%s' "$runs" | jq -r '.workflow_runs[] | @base64')

            # Preserve queued work while another run is active. Otherwise a
            # stale current-main queue could be cancelled and lost exactly while
            # the active run is still blocking the workflow concurrency lane.
            if [ "$active_any" = true ]; then
              echo "$workflow_file: a run is active; preserve queued work and do not dispatch"
              continue
            fi

            if [ "$fresh_current_queued" = true ]; then
              echo "$workflow_file: current-main run already queued/recovered; no duplicate dispatch"
              continue
            fi

            for run_id in "${stale_queued_ids[@]}"; do
              [ -n "$run_id" ] || continue
              echo "::warning title=$workflow_file stale queue::cancelling queued run $run_id"
              if ! gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"; then
                echo "::error title=$workflow_file stale queue recovery failed::unable to cancel queued run $run_id"
                failures=$((failures + 1))
              fi
            done

            if [ "${#stale_queued_ids[@]}" -gt 0 ]; then
              echo "$workflow_file: stale queue cleaned; dispatching current main"
              if ! gh workflow run "$workflow_file" --repo "$GITHUB_REPOSITORY" --ref main; then
                echo "::error title=$workflow_file dispatch failed::unable to dispatch current-main recovery run"
                failures=$((failures + 1))
              fi
            fi
          done

          if [ "$failures" -gt 0 ]; then
            echo "Long research recovery: FAIL failures=$failures"
            exit 1
          fi

          echo "Long research recovery: PASS"
