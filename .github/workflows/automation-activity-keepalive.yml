name: Repository automation keepalive

# Default-branch activity keepalive.
# This marker is control-plane-only: it does not alter prediction/model/evidence
# state and the marker path is outside the research evidence fingerprint.
#
# A dedicated non-default branch does not provide the repository activity
# guarantee needed for long-lived scheduled automation. The keepalive therefore
# writes a tiny timestamped control-plane marker to main.
on:
  schedule:
    - cron: "17 3 * * 0"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automation-activity-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Refresh default-branch activity marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Main can advance while this short control-plane job is running.
          # Rebuild from origin/main before each bounded push attempt so stale
          # local state can never be force-pushed over a newer main commit.
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git checkout -B main origin/main

            mkdir -p ops
            generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            main_sha="$(git rev-parse main)"
            cat > ops/automation_keepalive.json <<EOF
          {
            "schema_version": 2,
            "generated_at": "$generated_at",
            "main_sha": "$main_sha",
            "purpose": "default_branch_activity_keepalive",
            "production_changed": false,
            "model_changed": false,
            "evidence_changed": false
          }
          EOF

            git add ops/automation_keepalive.json
            if git diff --cached --quiet; then
              echo "automation keepalive: no change"
              exit 0
            fi

            git commit -m "chore: refresh repository automation keepalive"
            if git push origin HEAD:main; then
              echo "automation keepalive: default branch refreshed on attempt $attempt/3"
              exit 0
            fi

            echo "automation keepalive: main advanced during push; retrying attempt $((attempt + 1))/3"
            sleep $((attempt * 3))
          done

          echo "::error title=Keepalive main push failed::bounded retries exhausted"
          exit 1

      - name: Verify default-branch marker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("ops/automation_keepalive.json").read_text(encoding="utf-8"))
          assert payload["production_changed"] is False
          assert payload["model_changed"] is False
          assert payload["evidence_changed"] is False
          assert payload["purpose"] == "default_branch_activity_keepalive"
          print("automation keepalive marker verified")
          PY
