name: BOJ time-series research

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * 1-5"
      timezone: "Asia/Tokyo"
  push:
    paths:
      - "config/boj_series.yml"
      - "src/data/boj_api.py"
      - "src/research/boj_features.py"
      - "scripts/collect_boj_research.py"
      - "scripts/run_boj_ablation.py"
      - "tests/test_boj_api.py"
      - "tests/test_boj_features.py"
      - ".github/workflows/boj-timeseries-research.yml"

permissions:
  contents: read

concurrency:
  group: boj-timeseries-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: BOJ parser and PIT feature tests
        run: pytest -q tests/test_boj_api.py tests/test_boj_features.py tests/test_external_sources.py
      - name: Restore latest price state shards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf data/prices
          mkdir -p data/prices
          for shard in 0 1 2 3; do
            PRICE_SHARD_INDEX="$shard" python scripts/restore_latest_price_state.py
          done
          count=$(find data/prices -maxdepth 1 -name 'batch_*.parquet' -type f | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "DEFERRED: expected 4 restored price shard partitions, found $count"
            exit 1
          fi
      - name: Canonicalize restored price state
        run: python scripts/normalize_price_store.py
      - name: Collect BOJ research data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_boj_research.py
      - name: Run BOJ OOS ablation
        run: python scripts/run_boj_ablation.py
      - name: Upload BOJ research evidence
        uses: actions/upload-artifact@v7
        with:
          name: boj-timeseries-research-${{ github.run_id }}
          path: |
            data/research/boj_timeseries.parquet
            data/research/boj_timeseries.json
            data/research/boj_ablation.json
          retention-days: 14
