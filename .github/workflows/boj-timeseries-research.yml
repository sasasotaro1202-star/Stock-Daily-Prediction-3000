name: BOJ time-series research

on:
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * 1-5"
      timezone: "Asia/Tokyo"
  push:
    paths:
      - "config/boj_series.yml"
      - "src/data/boj_api.py"
      - "src/research/boj_features.py"
      - "scripts/collect_boj_research.py"
      - "scripts/run_boj_ablation.py"
      - "tests/test_boj_api.py"
      - "tests/test_boj_features.py"
      - ".github/workflows/boj-timeseries-research.yml"

permissions:
  contents: read

concurrency:
  group: boj-timeseries-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: BOJ parser and PIT feature tests
        run: pytest -q tests/test_boj_api.py tests/test_boj_features.py tests/test_external_sources.py
      - name: Restore latest price state shards when available
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data/prices
          for shard in 0 1 2 3; do
            PRICE_SHARD_INDEX="$shard" python scripts/restore_latest_price_state.py
          done
      - name: Refresh official universe for price bootstrap
        run: |
          set -euo pipefail
          python scripts/refresh_universe.py
          python scripts/universe_quality_gate.py
      - name: Update all price shards (reuse cache or free bootstrap)
        env:
          PRICE_SHARD_COUNT: 4
          PRICE_MAX_WORKERS: 1
        run: |
          set -euo pipefail
          pids=()
          for shard in 0 1 2 3; do
            (PRICE_SHARD_INDEX="$shard" python scripts/update_prices.py) > "data/prices/shard_${shard}.log" 2>&1 &
            pids+=("$!")
          done
          rc=0
          for pid in "${pids[@]}"; do
            wait "$pid" || rc=1
          done
          for shard in 0 1 2 3; do
            cat "data/prices/shard_${shard}.log"
            report="data/prices/price_deferred_shard_${shard}.json"
            if [ ! -f "$report" ]; then
              echo "FAIL: missing shard report $report"
              rc=1
            else
              python -c 'import json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); raise SystemExit(f"FAIL: price shard not fully resolved: {p}") if p.get("status") != "PASS" or p.get("deferred") else None' "$report" || rc=1
            fi
          done
          exit "$rc"
      - name: Canonicalize restored price state
        run: python scripts/normalize_price_store.py
      - name: Collect BOJ research data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_boj_research.py
      - name: Run BOJ OOS ablation
        run: python scripts/run_boj_ablation.py
      - name: Upload BOJ research evidence
        uses: actions/upload-artifact@v7
        with:
          name: boj-timeseries-research-${{ github.run_id }}
          path: |
            data/research/boj_timeseries.parquet
            data/research/boj_timeseries.json
            data/research/boj_ablation.json
          retention-days: 14
