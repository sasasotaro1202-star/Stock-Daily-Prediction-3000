name: Repository verification

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 1-5"
      timezone: "Asia/Tokyo"
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-verification-${{ github.event.pull_request.number || github.ref }}
  # Only the newest SHA should occupy the verification lane.
  # An older SHA must never delay verification of current main.
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - run: python -m compileall -q src scripts
      - name: Validate workflow YAML
        run: python -c "from pathlib import Path; import yaml; files=list(Path('.github/workflows').glob('*.yml')); [(_:=yaml.safe_load(p.read_text(encoding='utf-8'))) for p in files]; assert all(isinstance(yaml.safe_load(p.read_text(encoding='utf-8')), dict) and 'jobs' in yaml.safe_load(p.read_text(encoding='utf-8')) for p in files); print('workflow_yaml_valid', len(files))"
      - run: pytest -q
      - run: python scripts/research_smoke.py
      - run: python scripts/automation_invariants.py
      - run: python scripts/production_invariants.py
