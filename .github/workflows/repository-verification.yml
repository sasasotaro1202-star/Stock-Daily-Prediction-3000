name: Repository verification

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m compileall -q src scripts
      - run: pytest -q
      - run: python scripts/research_smoke.py
      - run: python scripts/production_invariants.py
