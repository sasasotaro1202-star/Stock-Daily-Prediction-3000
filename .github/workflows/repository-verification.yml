name: Repository verification

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "43 3 * * 1-5"
      timezone: "Asia/Tokyo"
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-verification-${{ github.event.pull_request.number || github.ref }}
  # Only the newest SHA should occupy the verification lane.
  # An older SHA must never delay verification of current main.
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - run: python -m compileall -q src scripts
      - name: Validate canonical Project Source contract
        run: python scripts/project_source_contract.py
      - name: Validate complete prediction-system OSS TOP1000 source
        run: |
          python scripts/build_external_prediction_system_oss_top1000_registry.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("config/external_prediction_system_oss_top1000_registry.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          integrity = d["source_rank_integrity"]
          assert integrity["complete"] is True
          assert integrity["actual_count"] == 1000
          assert integrity["unique_rank_count"] == 1000
          assert integrity["min_rank"] == 1
          assert integrity["max_rank"] == 1000
          safety = d["safety_contract"]
          assert safety["research_only"] is True
          assert safety["production_changed"] is False
          assert safety["promotion_allowed"] is False
          assert safety["frozen_holdout_used"] is False
          assert len(d["rows"]) == 1000
          print("external_oss_top1000_registry=PASS", d["entry_summary"])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: project-source-contract-${{ github.run_id }}
          path: data/research/project_source_contract.json
          retention-days: 7
      - name: Validate workflow YAML
        run: python -c 'from pathlib import Path; import yaml; docs=[yaml.safe_load(p.read_text(encoding="utf-8")) for p in Path(".github/workflows").glob("*.yml")]; assert all(isinstance(d, dict) and "jobs" in d for d in docs); print("workflow_yaml_valid", len(docs))'
      - run: pytest -q
      - run: python scripts/research_smoke.py
      - run: python scripts/automation_invariants.py
      - run: python scripts/production_invariants.py
