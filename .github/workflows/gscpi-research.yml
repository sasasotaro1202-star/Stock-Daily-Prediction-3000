name: GSCPI Research

on:
  workflow_dispatch:
  schedule:
    - cron: "31 0 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: gscpi-research
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - name: Collect official NY Fed GSCPI
        env:
          GSCPI_MAX_ATTEMPTS: "3"
        run: python scripts/collect_gscpi_research.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gscpi-research-${{ github.run_id }}
          path: data/research/gscpi_newyorkfed/
          if-no-files-found: error
          retention-days: 30
