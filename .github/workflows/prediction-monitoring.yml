name: Prediction monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  actions: read
  contents: read

concurrency:
  group: prediction-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Refresh current PayPay universe
        run: python scripts/refresh_universe.py
      - name: Restore current price state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p data/prices
          for i in 0 1 2 3; do
            PRICE_SHARD_INDEX="$i" python scripts/restore_latest_price_state.py || true
          done
      - name: Update free market context
        run: python scripts/update_market_context.py
      - name: Data quality
        run: python scripts/data_quality_gate.py
      - name: Monitor realized outcomes
        run: python scripts/monitor_predictions.py
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-${{ github.run_id }}
          path: data/research/monitor_latest.json
          retention-days: 14
