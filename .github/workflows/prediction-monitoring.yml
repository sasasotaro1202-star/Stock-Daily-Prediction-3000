name: Prediction monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1-5"
      timezone: "Asia/Tokyo"
    - cron: "27 9 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  actions: read
  contents: read

concurrency:
  group: prediction-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore bounded recent official universe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_latest_universe_state.py
      - name: Restore prediction history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/restore_prediction_history.py
      - name: Restore current price state
        id: restore_price
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p data/prices
          failed=0
          for i in 0 1 2 3; do
            if ! PRICE_SHARD_INDEX="$i" python scripts/restore_latest_price_state.py; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "restore_ok=false" >> "$GITHUB_OUTPUT"
            echo "restore_reason=price_state_shard_restore_failed" >> "$GITHUB_OUTPUT"
            echo "monitor price restore: DEFERRED (one or more price-state shards could not be restored)"
          else
            echo "restore_ok=true" >> "$GITHUB_OUTPUT"
            echo "restore_reason=restored" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine restored price availability
        id: price_state
        shell: bash
        run: |
          if [ "${{ steps.restore_price.outputs.restore_ok }}" = "true" ] && compgen -G "data/prices/*.parquet" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Canonicalize restored price store
        if: steps.price_state.outputs.available == 'true'
        run: python scripts/normalize_price_store.py
      - name: Update free market context
        if: steps.price_state.outputs.available == 'true'
        run: python scripts/update_market_context.py
      - name: Data quality
        if: steps.price_state.outputs.available == 'true'
        run: python scripts/data_quality_gate.py
      - name: Monitor realized outcomes
        if: steps.restore_price.outputs.restore_ok == 'true' && steps.price_state.outputs.available == 'true'
        run: python scripts/monitor_predictions.py
      - name: Record deferred monitoring state
        if: steps.restore_price.outputs.restore_ok != 'true' || steps.price_state.outputs.available != 'true'
        env:
          PRICE_RESTORE_OK: \${{ steps.restore_price.outputs.restore_ok }}
        shell: bash
        run: |
          mkdir -p data/research
          python - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "status": "DEFERRED",
              "evaluated": 0,
              "reason": "price_state_restore_failed",
              "production_action": "DEFERRED",
          }
          Path("data/research/monitor_latest.json").write_text(
              json.dumps(payload, indent=2),
              encoding="utf-8",
          )
          print("monitor_price_restore_deferred", json.dumps(payload))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: monitoring-${{ github.run_id }}
          path: data/research/monitor_latest.json
          retention-days: 14
