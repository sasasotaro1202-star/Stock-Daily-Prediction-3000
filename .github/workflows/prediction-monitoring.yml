name: Prediction monitoring

on:
  workflow_dispatch:
  schedule:
    # One canonical monitoring run; the reliability watchdog handles misses.
    - cron: "27 9 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  actions: read
  contents: write

concurrency:
  group: prediction-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore bounded recent official universe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_latest_universe_state.py
      - name: Restore prediction history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/restore_prediction_history.py
      - name: Restore current price state
        id: restore_price
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p data/prices
          failed=0
          for i in 0 1 2 3; do
            if ! PRICE_SHARD_INDEX="$i" python scripts/restore_latest_price_state.py; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "restore_ok=false" >> "$GITHUB_OUTPUT"
            echo "restore_reason=price_state_shard_restore_failed" >> "$GITHUB_OUTPUT"
            echo "monitor price restore: DEFERRED (one or more price-state shards could not be restored)"
          else
            echo "restore_ok=true" >> "$GITHUB_OUTPUT"
            echo "restore_reason=restored" >> "$GITHUB_OUTPUT"
          fi
      - name: Determine restored price availability
        id: price_state
        shell: bash
        run: |
          if [ "${{ steps.restore_price.outputs.restore_ok }}" = "true" ] && compgen -G "data/prices/*.parquet" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Canonicalize restored price store
        if: steps.price_state.outputs.available == 'true'
        run: python scripts/normalize_price_store.py
      - name: Update free market context
        if: steps.price_state.outputs.available == 'true'
        run: python scripts/update_market_context.py
      - name: Data quality
        id: data_quality
        if: steps.price_state.outputs.available == 'true'
        shell: bash
        run: |
          set +e
          python scripts/data_quality_gate.py
          rc=$?
          set -e
          status=''
          if [ -f data/research/data_quality.json ]; then
            status="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('data/research/data_quality.json').read_text(encoding='utf-8')).get('status',''))
          except Exception:
              print('')
          PY
          )"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "DEFERRED" ]; then
            echo "monitor data quality: DEFERRED (recording safe deferred state)"
            exit 0
          fi
          exit "$rc"
      - name: Bounded price-state recovery after deferred quality
        id: price_recovery
        if: steps.data_quality.outputs.status == 'DEFERRED'
        env:
          PRICE_SHARD_COUNT: 4
          PRICE_MAX_WORKERS: 2
        shell: bash
        run: |
          set -euo pipefail
          echo "monitor: bounded price recovery starting after deferred data quality"
          for i in 0 1 2 3; do
            echo "monitor: re-fetching price shard $i/4"
            PRICE_SHARD_INDEX="$i" PRICE_SHARD_COUNT="$PRICE_SHARD_COUNT" PRICE_MAX_WORKERS="$PRICE_MAX_WORKERS" python scripts/update_prices.py
          done
          python scripts/normalize_price_store.py
          python scripts/update_market_context.py

      - name: Re-check data quality after bounded recovery
        id: data_quality_retry
        if: steps.data_quality.outputs.status == 'DEFERRED'
        shell: bash
        run: |
          set +e
          python scripts/data_quality_gate.py
          rc=$?
          set -e
          status=''
          if [ -f data/research/data_quality.json ]; then
            status="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path('data/research/data_quality.json').read_text(encoding='utf-8')).get('status',''))
          except Exception:
              print('')
          PY
          )"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" = "DEFERRED" ]; then
            echo "monitor data quality: still DEFERRED after bounded recovery"
            exit 0
          fi
          exit "$rc"

      - name: Accumulate prediction experience
        run: python scripts/monitor_predictions.py

      - name: Record deferred monitoring state
        if: steps.restore_price.outputs.restore_ok != 'true' || steps.price_state.outputs.available != 'true' || (steps.data_quality.outputs.status == 'DEFERRED' && steps.data_quality_retry.outputs.status == 'DEFERRED')
        env:
          PRICE_RESTORE_OK: ${{ steps.restore_price.outputs.restore_ok }}
          PRICE_STATE_AVAILABLE: ${{ steps.price_state.outputs.available }}
          DATA_QUALITY_STATUS: ${{ steps.data_quality.outputs.status }}
          DATA_QUALITY_RETRY_STATUS: ${{ steps.data_quality_retry.outputs.status }}
        run: |
          mkdir -p data/research
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          data_quality_deferred = os.environ.get("DATA_QUALITY_STATUS") == "DEFERRED"
          data_quality_retry_deferred = os.environ.get("DATA_QUALITY_RETRY_STATUS") == "DEFERRED"
          reason = (
              "price_state_restore_failed"
              if os.environ.get("PRICE_RESTORE_OK") != "true"
              else "price_state_unavailable"
              if os.environ.get("PRICE_STATE_AVAILABLE") != "true"
              else "data_quality_deferred_after_bounded_recovery"
              if data_quality_deferred and data_quality_retry_deferred
              else "data_quality_deferred"
              if data_quality_deferred
              else "monitoring_deferred"
          )
          payload = {
              "status": "DEFERRED",
              "evaluated": 0,
              "reason": reason,
              "production_action": "DEFERRED",
          }
          Path("data/research/monitor_latest.json").write_text(
              json.dumps(payload, indent=2),
              encoding="utf-8",
          )
          print("monitor_price_restore_deferred", json.dumps(payload))
          PY
      - name: Validate accumulated experience output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/research/experience_memory.json")
          if p.exists():
              d = json.loads(p.read_text(encoding="utf-8"))
          else:
              d = {"version": 2, "total_resolved": 0}
          assert d.get("version") == 2
          assert int(d.get("total_resolved", 0)) >= 0
          print("experience_memory_valid", d.get("total_resolved", 0))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: monitoring-${{ github.run_id }}
          path: |
            data/research/monitor_latest.json
            data/research/experience_memory.json
          if-no-files-found: warn
          retention-days: 14
      - name: Persist accumulated experience
        if: github.ref == 'refs/heads/main' && steps.restore_price.outputs.restore_ok == 'true' && steps.price_state.outputs.available == 'true' && (steps.data_quality.outputs.status != 'DEFERRED' || steps.data_quality_retry.outputs.status != 'DEFERRED') && (hashFiles('data/research/experience_memory.json') != '' || hashFiles('data/research/performance_snapshot.json') != '')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/experience_memory.json
          if git diff --cached --quiet; then
            echo "experience-memory: no change"
            exit 0
          fi
          git commit -m "chore: accumulate resolved prediction experience"
          git push origin HEAD:main
