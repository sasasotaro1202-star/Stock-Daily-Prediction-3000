name: U.S. close prediction

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  actions: read
  contents: read

concurrency:
  group: us-close-prediction
  cancel-in-progress: false

jobs:
  refresh-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/refresh_universe.py
      - uses: actions/upload-artifact@v4
        with:
          name: morning-universe-${{ github.run_id }}
          path: data/universe/latest.json
          retention-days: 3

  price-shards:
    needs: refresh-universe
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: morning-universe-${{ github.run_id }}
          path: data/universe
      - name: Restore previous price state
        env:
          PRICE_SHARD_INDEX: ${{ matrix.shard }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_latest_price_state.py
      - name: Update assigned price shard
        env:
          PRICE_SHARD_INDEX: ${{ matrix.shard }}
          PRICE_SHARD_COUNT: 4
          PRICE_MAX_WORKERS: 2
        run: python scripts/update_prices.py
      - uses: actions/upload-artifact@v4
        with:
          name: morning-price-state-shard-${{ matrix.shard }}
          path: data/prices/
          retention-days: 3

  predict:
    needs: price-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: morning-universe-${{ github.run_id }}
          path: data/universe
      - uses: actions/download-artifact@v4
        with:
          pattern: morning-price-state-shard-*
          path: data/prices
          merge-multiple: true
      - name: Restore last approved research state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_latest_research_state.py
      - name: Price data quality gate
        run: python scripts/data_quality_gate.py
      - name: Production invariants
        run: python scripts/production_invariants.py
      - name: Production prediction
        run: python scripts/run_daily_prediction.py
      - uses: actions/upload-artifact@v4
        with:
          name: morning-prediction-${{ github.run_id }}
          path: data/predictions/
          retention-days: 7
