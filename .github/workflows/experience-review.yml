name: Experience review

on:
  workflow_dispatch:
  schedule:
    - cron: "7 18 * * 0"
      timezone: "Asia/Tokyo"
  workflow_run:
    workflows: ["Prediction monitoring"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: experience-review
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - name: Generate experience review and candidate plan
        run: python scripts/experience_review.py
      - name: Validate review and candidate artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          review = json.loads(Path("data/research/experience_review.json").read_text(encoding="utf-8"))
          candidates = json.loads(Path("data/research/experience_candidates.json").read_text(encoding="utf-8"))
          assert review.get("status") in {"READY", "WARMUP"}
          assert int(review.get("total_resolved", 0)) >= 0
          assert candidates.get("schema_version") == 1
          assert candidates.get("status") in {"READY", "WARMUP"}
          assert candidates.get("safety_contract", {}).get("research_only") is True
          assert candidates.get("safety_contract", {}).get("production_changed") is False
          print("experience_review_valid", review.get("total_resolved", 0))
          print("experience_candidates_valid", len(candidates.get("candidates", [])))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: experience-review-${{ github.run_id }}
          path: |
            data/research/experience_review.json
            data/research/experience_candidates.json
          retention-days: 90
