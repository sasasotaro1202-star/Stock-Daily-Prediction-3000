name: Bounded production recovery

on:
  workflow_run:
    workflows:
      - Market cycle
      - U.S. close prediction
      - Prediction monitoring
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: production-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun-failed-jobs:
    if: >
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-run failed or cancelled run once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --repo ${{ github.repository }}
