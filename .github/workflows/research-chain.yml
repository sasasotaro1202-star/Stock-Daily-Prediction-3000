name: Research chain
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily prediction research"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: stock-research-chain
  cancel-in-progress: false
jobs:
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e .
      - run: pytest -q
      - run: python scripts/research_smoke.py
      - run: echo "PIT/WFO research gate scaffold PASS; production approval remains blocked until real data, OOS metrics, calibration and frozen holdout are verified."
