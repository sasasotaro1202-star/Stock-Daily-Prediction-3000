name: Research chain

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily prediction research"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: stock-research-chain
  cancel-in-progress: false

jobs:
  research-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: pytest -q
      - run: python scripts/research_smoke.py
      - name: Verify configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("config/universe.yml").read_text()
          assert "require_pit: true" in text
          assert "frozen_holdout: true" in text
          assert "target_count: dynamic" in text
          print("research-gate: PASS")
          PY
      - run: echo "No production approval is emitted by this scaffold."
