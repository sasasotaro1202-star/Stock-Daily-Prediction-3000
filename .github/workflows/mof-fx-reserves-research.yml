name: Japan MOF FX Intervention and Reserves Research

on:
  workflow_dispatch:
  schedule:
    - cron: "18 8 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: mof-fx-reserves-research
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Collect MOF FX intervention and reserve data
        run: python scripts/collect_mof_fx_reserves_research.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mof-fx-reserves-research-${{ github.run_id }}
          path: |
            data/research/mof_fx_reserves_manifest.json
            data/research/mof_fx_intervention.csv
            data/research/mof_fx_intervention.csv.meta.json
            data/research/mof_official_reserves.csv
            data/research/mof_official_reserves.csv.meta.json
          if-no-files-found: error
          retention-days: 30
