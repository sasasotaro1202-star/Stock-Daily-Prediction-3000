name: Research validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/research_validation.trigger"
      - ".github/workflows/research-validation.yml"

permissions:
  actions: read
  contents: write

concurrency:
  # Isolate the newest recovery lane from stale/orphaned executions, which
  # remained in progress without GitHub-side timestamp updates for hours.
  group: research-validation-v4
  # Preserve an active chronological OOS run. A newer push queues behind it
  # instead of cancelling a long-running research execution mid-fold.
  cancel-in-progress: false

jobs:
  restore-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore latest official universe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_latest_universe_state.py
      - name: Refresh official universe with current parser
        run: python scripts/refresh_universe.py
      - name: Validate refreshed universe
        run: python scripts/universe_quality_gate.py
      - uses: actions/upload-artifact@v7
        with:
          name: research-validation-universe-${{ github.run_id }}
          path: data/universe/latest.json
          retention-days: 3

  price-shards:
    needs: restore-universe
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: research-validation-universe-${{ github.run_id }}
          path: data/universe
      - name: Restore previous price state
        env:
          PRICE_SHARD_INDEX: ${{ matrix.shard }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_latest_price_state.py
      - name: Update assigned price shard
        env:
          PRICE_SHARD_INDEX: ${{ matrix.shard }}
          PRICE_SHARD_COUNT: 4
          PRICE_MAX_WORKERS: 2
        run: python scripts/update_prices.py
      - uses: actions/upload-artifact@v7
        with:
          name: research-validation-price-${{ matrix.shard }}-${{ github.run_id }}
          path: data/prices/
          retention-days: 3

  research:
    needs: price-shards
    runs-on: ubuntu-latest
    # OOS is CPU-heavy across chronological folds and challengers. Keep
    # verification/recovery safe while allowing a full research pass to finish.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,research]"
      - uses: actions/download-artifact@v7
        with:
          pattern: research-validation-price-*-${{ github.run_id }}
          path: data/prices
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: research-validation-universe-${{ github.run_id }}
          path: data/universe
      - name: Update free market context
        run: python scripts/update_market_context.py
      - name: Automation invariant preflight
        run: python scripts/automation_invariants.py
      - name: PayPay master catalog integrity
        run: python scripts/catalog_integrity.py
      - name: Canonicalize price store
        run: python scripts/normalize_price_store.py
      - name: Universe quality gate
        run: python scripts/universe_quality_gate.py
      - name: Price data quality gate
        run: python scripts/data_quality_gate.py
      - name: Independent raw-input PIT leakage audit
        run: python scripts/run_independent_leakage_audit.py
      - name: Fail-fast conformal unit tests
        run: pytest -q tests/test_conformal_classification.py
      - name: Ultimate v13 unit tests
        run: pytest -q tests/test_ultimate_v13.py
      - name: Ultimate v13 meta-leakage audit
        run: python scripts/run_v13_meta_leakage_audit.py
      - name: Ultimate v13 adversarial structural robustness
        run: python scripts/run_v13_adversarial_robustness.py


      - name: Chronological OOS research
        id: research_oos
        run: python scripts/run_daily_research.py
      - name: Validate Ultimate v13 research artifact
        if: steps.research_oos.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/research/latest_metrics.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          v13 = data.get("ultimate_v13")
          if not isinstance(v13, dict):
              raise SystemExit("FAIL: ultimate_v13 payload missing")
          if v13.get("promotion_allowed") is not False:
              raise SystemExit("FAIL: v13 research layer must remain promotion-blocked")
          if not v13.get("research_only"):
              raise SystemExit("FAIL: v13 research_only invariant missing")
          summary = Path("data/research/ultimate_v13/ultimate_summary.json")
          manifest = Path("data/research/ultimate_v13/artifact_manifest.json")
          meta_audit = Path("data/research/v13_meta_leakage_audit.json")
          adversarial_audit = Path("data/research/ultimate_v13/adversarial_robustness.json")
          v13_tta = Path("data/research/ultimate_v13/tta.json")
          v13_scenarios = Path("data/research/ultimate_v13/scenarios.json")
          v13_contracts = Path("data/research/ultimate_v13/prediction_contracts.json")
          v13_ledger = Path("data/research/ultimate_v13/prediction_ledger.json")
          v13_router = Path("data/research/ultimate_v13/router_stability.json")
          v13_info = Path("data/research/ultimate_v13/active_information.json")
          v13_meta = Path("data/research/ultimate_v13/meta_label.json")
          v13_history = Path("data/research/ultimate_v13/prediction_history.json")
          v13_strategy_failure = Path("data/research/ultimate_v13/strategy_failure.json")
          v13_governance = Path("data/research/ultimate_v13/governance.json")
          v13_registry = Path("data/research/ultimate_v13/experiment_registry.json")
          if (
              not summary.exists()
              or not manifest.exists()
              or not meta_audit.exists()
              or not adversarial_audit.exists()
              or not v13_tta.exists()
              or not v13_scenarios.exists()
              or not v13_contracts.exists()
              or not v13_ledger.exists()
              or not v13_router.exists()
              or not v13_info.exists()
              or not v13_meta.exists()
              or not v13_history.exists()
              or not v13_strategy_failure.exists()
              or not v13_governance.exists()
              or not v13_registry.exists()
          ):
              raise SystemExit("FAIL: v13 artifact files missing")
          audit = json.loads(meta_audit.read_text(encoding="utf-8"))
          if audit.get("status") != "PASS":
              raise SystemExit("FAIL: v13 meta-leakage audit did not PASS")
          adversarial = json.loads(adversarial_audit.read_text(encoding="utf-8"))
          if adversarial.get("status") != "PASS":
              raise SystemExit("FAIL: v13 adversarial structural audit did not PASS")
          manifest_data = json.loads(manifest.read_text(encoding="utf-8"))
          required_artifacts = {
              "prediction_history.json",
              "strategy_failure.json",
              "governance.json",
              "experiment_registry.json",
          }
          if not required_artifacts.issubset(set(manifest_data.get("artifacts") or [])):
              raise SystemExit("FAIL: v13 manifest missing required governance/history artifacts")
          governance = json.loads(v13_governance.read_text(encoding="utf-8"))
          if governance.get("contracts", {}).get("research_only") is not True:
              raise SystemExit("FAIL: v13 governance research_only contract missing")
          if governance.get("contracts", {}).get("no_auto_promotion") is not True:
              raise SystemExit("FAIL: v13 governance auto-promotion safety contract missing")
          registry = json.loads(v13_registry.read_text(encoding="utf-8"))
          if registry.get("validation", {}).get("status") != "PASS":
              raise SystemExit("FAIL: v13 experiment registry validation did not PASS")
          json.loads(summary.read_text(encoding="utf-8"))
          json.loads(v13_history.read_text(encoding="utf-8"))
          json.loads(v13_strategy_failure.read_text(encoding="utf-8"))
          print("ULTIMATE_V13_ARTIFACT=PASS")
          print("ULTIMATE_V13_FOLDS=", v13.get("folds"))
          print("ULTIMATE_V13_MODELS=", len(v13.get("models") or []))
          print("ULTIMATE_V13_PREDICTABILITY_MEAN=", (v13.get("predictability") or {}).get("mean"))
          print("ULTIMATE_V13_DYNAMIC_LOGLOSS=", ((v13.get("routing") or {}).get("aggregate") or {}).get("dynamic", {}).get("logloss"))
          print("ULTIMATE_V13_EQUAL_LOGLOSS=", ((v13.get("routing") or {}).get("aggregate") or {}).get("equal_weight", {}).get("logloss"))
          PY

      - name: Publish Ultimate v13 score summary
        if: always() && steps.research_oos.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d = json.loads(Path("data/research/latest_metrics.json").read_text(encoding="utf-8"))
          v = d.get("ultimate_v13") or {}
          r = (v.get("routing") or {}).get("aggregate") or {}
          dyn = r.get("dynamic") or {}
          eq = r.get("equal_weight") or {}
          print("## Ultimate v13 research layer")
          print(f"- Status: {v.get('status')}")
          print(f"- Folds: {v.get('folds')}")
          print(f"- Models: {len(v.get('models') or [])}")
          print(f"- Predictability proxy mean: {(v.get('predictability') or {}).get('mean', 'n/a')}")
          print(f"- Dynamic LogLoss: {dyn.get('logloss', 'n/a')}")
          print(f"- Equal-weight LogLoss: {eq.get('logloss', 'n/a')}")
          print(f"- Dynamic LogLoss relative improvement: {r.get('relative_logloss_improvement', 'n/a')}")
          print(f"- Dynamic Accuracy: {dyn.get('accuracy', 'n/a')}")
          print(f"- Equal-weight Accuracy: {eq.get('accuracy', 'n/a')}")
          print(f"- Dynamic Brier: {dyn.get('brier', 'n/a')}")
          print(f"- Equal-weight Brier: {eq.get('brier', 'n/a')}")
          print(f"- Dynamic ECE: {dyn.get('ece', 'n/a')}")
          print(f"- Equal-weight ECE: {eq.get('ece', 'n/a')}")
          tta = v.get("tta") or {}
          td = tta.get("tta") or {}
          dd = tta.get("dynamic") or {}
          print(f"- Prior-only TTA status: {tta.get('status', 'n/a')}")
          print(f"- Prior-only TTA LogLoss: {td.get('logloss', 'n/a')}")
          print(f"- Dynamic pre-TTA LogLoss: {dd.get('logloss', 'n/a')}")
          print(f"- Active information status: {(v.get('active_information') or {}).get('status', 'n/a')}")
          print(f"- Router stability status: {(v.get('router_stability') or {}).get('status', 'n/a')}")
          print(f"- Meta-label status: {(v.get("meta_label") or {}).get("status", "n/a")}")
          print(f"- Meta-label coverage: {(v.get("meta_label") or {}).get("locked_summary", {}).get("coverage", "n/a")}")
          print(f"- Error attribution: {(v.get("error_attribution") or {}).get("status", "n/a")}")
          print(f"- Failure memory rows: {(v.get("failure_memory") or {}).get("total_rows", "n/a")}")
          adv = Path("data/research/ultimate_v13/adversarial_robustness.json")
          if adv.exists():
              print(f"- Adversarial structural audit: {json.loads(adv.read_text(encoding='utf-8')).get('status', 'n/a')}")
          else:
              print("- Adversarial structural audit: missing")
          print(f"- Production changed: {v.get('production_changed')}")
          print(f"- Promotion allowed: {v.get('promotion_gate', {}).get('allowed')}")
          PY

      - name: Publish compact OOS score summary
        if: always() && steps.research_oos.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = Path("data/research/latest_metrics.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          selected = str(d.get("selected_model") or "unknown")
          m = (d.get("results") or {}).get(selected, {}).get("metrics") or {}
          r = d.get("return_oos") or {}
          rm = r.get("metrics") or {}
          print("## Chronological OOS score")
          print(f"- Selected model: `{selected}`")
          print(f"- LogLoss: `{m.get('logloss', 'n/a')}`")
          print(f"- Brier: `{m.get('brier', 'n/a')}`")
          print(f"- ECE: `{m.get('ece', 'n/a')}`")
          print(f"- Accuracy: `{m.get('accuracy', 'n/a')}`")
          print(f"- Rank IC: `{m.get('rank_ic', 'n/a')}`")
          print(f"- Return MAE: `{rm.get('mae', 'n/a')}`")
          print(f"- Return sign accuracy: `{rm.get('sign_accuracy', 'n/a')}`")
          PY
      - name: Collect free SEC filing research inputs
        id: sec_research
        env:
          SEC_USER_AGENT: "Stock-Daily-Prediction-3000/0.1 (GitHub Actions; contact: 262083466+sasasotaro1202-star@users.noreply.github.com)"
        run: python scripts/sec_filings_research.py
      - name: Run SEC filing OOS challenger ablation
        id: sec_ablation
        run: python scripts/run_sec_filing_ablation.py
      - name: CPCV leakage-boundary research audit
        id: cpcv
        run: python scripts/run_cpcv_validation_audit.py
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: warn
          name: research-validation-evidence-${{ github.run_id }}
          path: |
            data/research/latest_metrics.json
            data/research/leakage_audit.json
            data/research/data_quality.json
            data/research/sec_filings_research.json
            data/research/sec_filing_ablation.json
            data/research/cpcv_validation_audit.json
            data/research/universe_quality.json
            data/research/ultimate_v13/**
          retention-days: 14

