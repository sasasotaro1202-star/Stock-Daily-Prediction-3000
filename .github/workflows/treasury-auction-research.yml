name: U.S. Treasury Auction Research

on:
  workflow_dispatch:
  schedule:
    - cron: "42 7 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  contents: read

concurrency:
  group: treasury-auction-research
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Collect U.S. Treasury auction research data
        run: python scripts/collect_treasury_auction_research.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: treasury-auction-research-${{ github.run_id }}
          path: data/research/treasury_auctions_research.json
          if-no-files-found: error
          retention-days: 30
