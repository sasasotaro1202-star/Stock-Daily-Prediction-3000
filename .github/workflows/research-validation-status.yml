name: Research validation status

on:
  workflow_run:
    workflows: ["Research validation"]
    types: [requested, in_progress, completed]
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  # Serialize status commits with each other, but never share the Research validation concurrency lane.
  group: research-validation-status

  cancel-in-progress: false

jobs:
  persist-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Status persistence must execute the newest fail-safe controller
          # from main, while the research run SHA remains only provenance.
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project package for status helpers
        run: pip install -e .
      - name: Resolve Research status context
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          RESEARCH_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          RESEARCH_WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          RESEARCH_WORKFLOW_STATUS: ${{ github.event.workflow_run.status || '' }}
          RESEARCH_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
        run: python scripts/resolve_research_status_context.py
      - name: Download completed OOS evidence
        if: env.RESEARCH_STATUS_CONTEXT_FOUND == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v7
        with:
          name: research-validation-evidence-${{ env.RESEARCH_WORKFLOW_RUN_ID }}
          path: research-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RESEARCH_WORKFLOW_RUN_ID }}
      - name: Restore OOS metrics for longitudinal snapshot
        if: env.RESEARCH_STATUS_CONTEXT_FOUND == 'true' && github.event_name == 'workflow_run' && env.RESEARCH_WORKFLOW_CONCLUSION == 'success'
        shell: bash
        run: |
          set -euo pipefail
          source_file="$(find research-evidence -type f -name latest_metrics.json -print -quit 2>/dev/null)"
          if [ -z "${source_file}" ]; then
            echo "Research evidence missing: successful Research validation produced no latest_metrics.json artifact"
            exit 1
          fi
          mkdir -p data/research
          cp "${source_file}" data/research/latest_metrics.json
          python scripts/persist_research_validation_snapshot.py
      - name: Persist research validation status
        if: env.RESEARCH_STATUS_CONTEXT_FOUND == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python scripts/persist_research_validation_status.py

      - name: Preserve generated status outputs
        if: always() && env.RESEARCH_STATUS_CONTEXT_FOUND == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/research-validation-status
          mkdir -p /tmp/research-validation-status
          cp artifacts/research_validation_status.json /tmp/research-validation-status/
          if [ -f artifacts/research_validation_latest.json ]; then
            cp artifacts/research_validation_latest.json /tmp/research-validation-status/
          fi
      - name: Commit research status evidence
        if: always() && env.RESEARCH_STATUS_CONTEXT_FOUND == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin research-status >/dev/null 2>&1; then
            git fetch origin research-status
            # Generated status files are already preserved above. Force the
            # branch switch so those working-tree files cannot block checkout.
            git checkout -B research-status origin/research-status --force
          else
            git checkout -B research-status --force
          fi
          mkdir -p artifacts
          cp /tmp/research-validation-status/research_validation_status.json artifacts/research_validation_status.json
          if [ -f /tmp/research-validation-status/research_validation_latest.json ]; then
            cp /tmp/research-validation-status/research_validation_latest.json artifacts/research_validation_latest.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/research_validation_status.json
          if [ -f artifacts/research_validation_latest.json ]; then
            git add artifacts/research_validation_latest.json
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Persist research validation status"
          git push origin HEAD:research-status
