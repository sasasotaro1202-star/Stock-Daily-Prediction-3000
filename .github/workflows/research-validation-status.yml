name: Research validation status

on:
  workflow_run:
    workflows: ["Research validation"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  # Serialize status commits with each other, but never share the Research validation concurrency lane.
  group: research-validation-status

  cancel-in-progress: false

jobs:
  persist-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select serialized research-status branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin research-status >/dev/null 2>&1; then
            git fetch origin research-status
            git checkout -B research-status origin/research-status
          else
            git checkout -B research-status
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download completed OOS evidence
        if: github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: research-validation-evidence-${{ github.event.workflow_run.id }}
          path: research-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Restore OOS metrics for longitudinal snapshot
        shell: bash
        run: |
          set -euo pipefail
          source_file="$(find research-evidence -type f -name latest_metrics.json -print -quit 2>/dev/null || true)"
          if [ -n "${source_file}" ]; then
            mkdir -p data/research
            cp "${source_file}" data/research/latest_metrics.json
            python scripts/persist_research_validation_snapshot.py
          else
            echo "No successful OOS metrics artifact available; snapshot remains absent."
          fi
      - name: Persist research validation status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESEARCH_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          RESEARCH_WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          RESEARCH_WORKFLOW_STATUS: ${{ github.event.workflow_run.status }}
          RESEARCH_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: python scripts/persist_research_validation_status.py
      - name: Commit research status evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/research_validation_status.json artifacts/research_validation_latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist research validation status"
          git push origin HEAD:research-status
