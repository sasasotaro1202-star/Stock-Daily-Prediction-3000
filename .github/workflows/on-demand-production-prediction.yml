name: On-demand production prediction

on:
  workflow_dispatch:
    inputs:
      asset_classes:
        description: "Comma-separated production asset classes"
        required: false
        default: "jp_stock,jp_etf,jp_reit,us_stock,us_etf"

permissions:
  actions: read
  contents: read

concurrency:
  group: on-demand-production-prediction
  cancel-in-progress: false

jobs:
  restore-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Restore bounded recent official universe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_latest_universe_state.py
      - uses: actions/upload-artifact@v4
        with:
          name: ondemand-universe-${{ github.run_id }}
          path: data/universe/latest.json
          retention-days: 3

  price-shards:
    needs: restore-universe
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: ondemand-universe-${{ github.run_id }}
          path: data/universe
      - name: Restore previous price state
        env:
          PRICE_SHARD_INDEX: ${{ matrix.shard }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_latest_price_state.py
      - name: Update assigned price shard
        env:
          PRICE_SHARD_INDEX: ${{ matrix.shard }}
          PRICE_SHARD_COUNT: 4
          PRICE_MAX_WORKERS: 2
          PRICE_ASSET_CLASSES: ${{ inputs.asset_classes }}
        run: python scripts/update_prices.py
      - uses: actions/upload-artifact@v4
        with:
          name: ondemand-price-state-shard-${{ matrix.shard }}
          path: data/prices/
          retention-days: 3

  predict:
    needs: price-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: ondemand-universe-${{ github.run_id }}
          path: data/universe
      - uses: actions/download-artifact@v4
        with:
          pattern: ondemand-price-state-shard-*
          path: data/prices
          merge-multiple: true
      - name: Restore latest approved production research state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/restore_latest_research_state.py
      - name: Restore exact approved production runtime
        run: python scripts/install_production_runtime.py
      - name: PayPay master catalog integrity
        run: python scripts/catalog_integrity.py
      - name: Canonicalize price store
        run: python scripts/normalize_price_store.py
      - name: Scoped price data quality
        env:
          QUALITY_ASSET_CLASSES: ${{ inputs.asset_classes }}
        run: python scripts/data_quality_gate.py
      - name: Validate immutable production model artifact
        run: |
          python - <<'PY'
          from src.prediction.production_artifact import load_production_artifact
          artifact = load_production_artifact()
          print("production-model-artifact: PASS")
          print("selected_model=", artifact["metadata"]["selected_model"])
          print("created_at=", artifact["metadata"]["created_at"])
          PY
      - name: Update free market context
        run: python scripts/update_market_context.py
      - name: Production prediction
        env:
          PREDICT_ASSET_CLASSES: ${{ inputs.asset_classes }}
        run: python scripts/run_daily_prediction.py
      - name: Validate production prediction output
        run: python scripts/validate_prediction_output.py
      - uses: actions/upload-artifact@v4
        with:
          name: ondemand-production-prediction-${{ github.run_id }}
          path: data/predictions/
          retention-days: 7
