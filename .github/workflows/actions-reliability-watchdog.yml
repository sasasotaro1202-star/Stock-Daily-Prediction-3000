name: Actions reliability watchdog

# Recovery trigger: rerun watchdog on latest HEAD after research timeout-policy alignment.
#
# Research validation intentionally does not trigger this workflow via workflow_run.
# The watchdog uses its 5-minute schedule (plus manual recovery trigger) to
# inspect research runs. This prevents cancel-in-progress from self-cancelling a
# watchdog instance immediately after another research lifecycle event.

on:
  workflow_dispatch:
  # Scheduled recovery is the canonical trigger. This deliberately avoids a
  # push-triggered watchdog competing with Repository verification on every commit.
  schedule:
    # Run every 5 minutes so stale queued/active research is recovered promptly.
    - cron: "*/5 * * * *"
      timezone: "Asia/Tokyo"

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-reliability-watchdog
  # Only the newest watchdog should execute; an older queued watchdog carries
  # an obsolete GITHUB_SHA and must never cancel a newer research run.
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Research evidence invalidation checks compare the active run SHA with current main.
          # Full history is required so missing ancestry does not become a false control-plane-only state.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project package for automation invariants
        run: pip install -e .
      - name: Verify automation contract
        run: python scripts/automation_invariants.py

      - name: Inspect recent critical workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '96 hours ago' +%s)"
          queued_cutoff="$(date -u -d '30 minutes ago' +%s)"
          stale_cutoff="$(date -u -d '120 minutes ago' +%s)"
          failures=0
          # The watchdog is a scheduled control-plane job; GITHUB_SHA may refer to
          # the workflow checkout revision rather than the latest main branch head.
          # Always resolve the live main ref before comparing/recovering any run.
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ -z "$current_sha" ]; then
            echo "::error title=Watchdog current-main resolution failed::unable to resolve live main HEAD"
            exit 1
          fi

          evidence_diff_state() {
            local base_sha="$1"
            local changed_path
            # Mirror src.validation.code_fingerprint evidence scope. Explicitly
            # allow only known control-plane-only workflow files to change without
            # invalidating an active chronological OOS. Any unlisted workflow is
            # evidence-affecting by default.
            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              return 2
            fi
            if ! git merge-base --is-ancestor "$base_sha" "$current_sha" 2>/dev/null; then
              return 2
            fi
            while IFS= read -r changed_path; do
              case "$changed_path" in
                pyproject.toml)
                  return 0
                  ;;
                config/*|src/*|scripts/*)
                  case "$changed_path" in
                    # These scripts only validate/document the automation contract;
                    # they cannot change prediction/OOS evidence and therefore must
                    # not cancel a valid active chronological OOS run.
                    scripts/automation_invariants.py|scripts/project_source_contract.py)
                      continue
                      ;;
                    *.py|*.yml|*.yaml)
                      return 0
                      ;;
                  esac
                  ;;
                .github/workflows/*)
                  case "$changed_path" in
                    .github/workflows/heartbeat.yml|.github/workflows/automation-supervisor.yml|.github/workflows/actions-reliability-watchdog.yml|.github/workflows/research-autopilot.yml|.github/workflows/long-research-recovery.yml|.github/workflows/automation-failure-learning.yml|.github/workflows/research-validation-status.yml|.github/workflows/24h-research-marathon-watchdog.yml|.github/workflows/bounded-production-recovery.yml)
                      continue
                      ;;
                    *.py|*.yml|*.yaml)
                      return 0
                      ;;
                  esac
                  ;;
              esac
            done < <(git diff --name-only "$base_sha" "$current_sha")
            return 1
          }

          inspect_workflow() {
            local workflow_file="$1"
            local workflow_name="$2"
            local self_heal_queued="${3:-false}"
            local self_heal_failed="${4:-false}"
            local runs
            if ! runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?per_page=20" 2>/dev/null)"; then
              echo "::error title=${workflow_name} Actions API unavailable::unable to inspect recent workflow runs"
              failures=$((failures + 1))
              return 0
            fi

            latest_run_found=false
            current_run_found=false
            stale_queued_found=false
            stale_queue_recovery_failed=false
          run_entries="$(printf '%s' "$runs" | jq -r '.workflow_runs[] | @base64')"
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            run_json="$(printf '%s' "$encoded" | base64 -d)"
            created="$(printf '%s' "$run_json" | jq -r '.created_at // empty')"
            [ -n "$created" ] || continue
            created_epoch="$(date -d "$created" +%s 2>/dev/null || echo 0)"
            [ "$created_epoch" -ge "$cutoff" ] || break

            status="$(printf '%s' "$run_json" | jq -r '.status // empty')"
            conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // empty')"
            attempt="$(printf '%s' "$run_json" | jq -r '.run_attempt // 1')"
            run_id="$(printf '%s' "$run_json" | jq -r '.id // empty')"
            head_sha="$(printf '%s' "$run_json" | jq -r '.head_sha // empty')"
            updated="$(printf '%s' "$run_json" | jq -r '.updated_at // empty')"
            updated_epoch="$(date -d "$updated" +%s 2>/dev/null || echo 0)"

            if { [ "$status" = "queued" ] || [ "$status" = "pending" ]; } && [ "$updated_epoch" -gt 0 ] && [ "$created_epoch" -lt "$queued_cutoff" ]; then
              if [ "$self_heal_queued" = "true" ]; then
                stale_queued_found=true
                echo "::warning title=$workflow_name queued stall::queued run $run_id has remained queued for over 30 minutes; cancelling stale queue entry"
                if gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"; then
                  echo "$workflow_name: stale queued run $run_id cancelled"
                else
                  echo "::error title=$workflow_name queued recovery cancel failed::unable to cancel stale queued run $run_id"
                  stale_queue_recovery_failed=true
                  failures=$((failures + 1))
                fi
                continue
              elif [ "$workflow_name" = "Bounded production recovery" ]; then
                echo "::warning title=$workflow_name stale queue cleanup::queued recovery run $run_id is stale; cancelling without dispatching a recovery-of-recovery run"
                if gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"; then
                  echo "$workflow_name: stale queued recovery run $run_id cancelled"
                else
                  echo "::error title=$workflow_name stale queue cleanup failed::unable to cancel stale queued recovery run $run_id"
                  failures=$((failures + 1))
                fi
                continue
              fi
            fi
            if [ "$workflow_name" != "Bounded production recovery" ] && [ "$head_sha" != "$current_sha" ]; then
              echo "${workflow_name}: ignoring run ${run_id} on superseded SHA ${head_sha}; current=${current_sha}"
              continue
            fi

            latest_run_found=true
            current_run_found=true

            echo "WATCHDOG_LATEST workflow=${workflow_name} run=${run_id} status=${status} conclusion=${conclusion} attempt=${attempt} head_sha=${head_sha}"

            if [ "$workflow_name" = "Bounded production recovery" ]; then
              if [ "$status" = "completed" ] && [ "$conclusion" = "failure" ]; then
                echo "::error title=${workflow_name} recovery failure::latest recovery run ${run_id} failed"
                failures=$((failures + 1))
              elif [ "$status" != "completed" ] && [ "$updated_epoch" -gt 0 ] && [ "$updated_epoch" -lt "$stale_cutoff" ]; then
                echo "::error title=${workflow_name} stale recovery::latest recovery run ${run_id} has been non-completed for over 120 minutes"
                failures=$((failures + 1))
              fi
              break
            fi

            if [ "$status" = "completed" ] && [ "$conclusion" = "failure" ]; then
              if [ "$attempt" -ge 2 ]; then
                echo "::error title=${workflow_name} unresolved failure::latest run ${run_id} is still failing after bounded recovery"
                failures=$((failures + 1))
              elif [ "$self_heal_failed" = "true" ]; then
                echo "::warning title=${workflow_name} transient failure recovery::latest run $run_id failed on attempt 1; rerunning the same current-main execution once"
                if gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY"; then
                  echo "$workflow_name: bounded failure rerun requested for run $run_id"
                else
                  echo "::error title=${workflow_name} failure rerun failed::unable to rerun failed current-main run $run_id"
                  failures=$((failures + 1))
                fi
              else
                echo "${workflow_name}: latest run failed on attempt 1; no automatic failure rerun is enabled for this workflow"
              fi
            elif [ "$status" != "completed" ] && [ "$updated_epoch" -gt 0 ] && [ "$updated_epoch" -lt "$stale_cutoff" ]; then
              echo "::error title=${workflow_name} stale run::latest run ${run_id} has been non-completed for over 120 minutes"
              failures=$((failures + 1))
            fi
            break
          done <<< "$run_entries"

          if [ "$stale_queued_found" = true ]; then
            if [ "$stale_queue_recovery_failed" = true ]; then
              echo "::error title=$workflow_name queued recovery incomplete::at least one stale queued run could not be cancelled; refusing to dispatch another run"
            else
              if ! gh workflow run "$workflow_file" --repo "$GITHUB_REPOSITORY" --ref main; then
                echo "::error title=$workflow_name queued recovery dispatch failed::unable to dispatch a fresh main-branch run"
                failures=$((failures + 1))
              else
                echo "$workflow_name: bounded queued recovery dispatched on main"
              fi
            fi
            return 0
          fi

          if [ "$current_run_found" = false ]; then
            echo "${workflow_name}: no applicable run found in watchdog window"
          fi
          }

          # Verification and autopilot are control-plane prerequisites for expensive Research.
          # Recover stale queued entries on the current main SHA instead of leaving the
          # whole Research lane blocked indefinitely by runner/queue incidents.
          inspect_workflow "repository-verification.yml" "Repository verification" true true
          inspect_workflow "research-autopilot.yml" "Research autopilot" true true
          inspect_workflow "24h-research-marathon.yml" "24H Research Marathon" true

          inspect_workflow "market-cycle.yml" "Market cycle" true
          inspect_workflow "us-close-prediction.yml" "U.S. close prediction" false
          inspect_workflow "prediction-monitoring.yml" "Prediction monitoring" false
          inspect_workflow "bounded-production-recovery.yml" "Bounded production recovery" false
          inspect_workflow "automation-failure-learning.yml" "Automation failure learning" true true
          inspect_workflow "experience-review.yml" "Experience review" true true
          inspect_workflow "long-research-recovery.yml" "Long research recovery" true true
          # Short research collectors are safe for bounded first-failure retry and
          # stale-run recovery. Long OOS collectors remain failure-memory only
          # to avoid cancelling legitimate multi-hour research.
          inspect_workflow "daily-watchlist.yml" "Daily priority watchlist" true true
          inspect_workflow "research-validation-status.yml" "Research validation status" true true
          inspect_workflow "free-data-source-discovery.yml" "Free Data Source Discovery" true true
          inspect_workflow "boj-frontier-research.yml" "BOJ Frontier Research" true true
          inspect_workflow "estat-dashboard-research.yml" "e-Stat Dashboard Research" true true
          inspect_workflow "fred-cross-asset-research.yml" "FRED Cross-Asset Research" true true
          inspect_workflow "mof-fx-reserves-research.yml" "Japan MOF FX Intervention and Reserves Research" true true
          inspect_workflow "mof-securities-research.yml" "Japan MOF Securities Flow Research" true true
          inspect_workflow "sec-companyfacts-research.yml" "SEC XBRL Company Facts Research" true true
          inspect_workflow "sec-filings-research.yml" "SEC filings research" true true
          inspect_workflow "sec-submissions-research.yml" "SEC EDGAR Submissions Research" true true
          inspect_workflow "sec-insider-ownership-research.yml" "SEC Insider and Ownership Research" true true
          inspect_workflow "treasury-auction-research.yml" "U.S. Treasury Auction Research" true true
          inspect_workflow "treasury-rate-family-research.yml" "U.S. Treasury Rate Family Research" true true

          inspect_research_validation() {
            local workflow_file="research-validation.yml"
            local workflow_name="Research validation"
            local runs
            if ! runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?per_page=20" 2>/dev/null)"; then
              echo "::error title=${workflow_name} Actions API unavailable::unable to inspect recent workflow runs"
              failures=$((failures + 1))
              return 0
            fi

            local now_epoch
            now_epoch="$(date -u +%s)"
            local research_stale_epoch
            # Research OOS can use the full 6-hour hosted-runner limit; cancel runs after 350 minutes
            # of active age so a legitimate long-running chronological OOS is preserved.
            research_stale_epoch="$((now_epoch - 350 * 60))"
            local research_inactive_epoch
            # A genuinely stalled run can block every newer research validation indefinitely.
            # Require at least a 120-minute no-update window before cancelling; this is separate
            # from the 350-minute hard-age guard and still preserves normal long OOS work.
            research_inactive_epoch="$((now_epoch - 120 * 60))"
            local queued_cutoff_epoch
            queued_cutoff_epoch="$((now_epoch - 30 * 60))"
            local active_run_id=""
            local active_run_started_epoch=0
            local recovery_needed=false
            local latest_terminal_id=""
            local latest_terminal_run_number=0
            local latest_terminal_attempt=1
            local latest_terminal_conclusion=""
            local latest_terminal_head_sha=""
            local latest_terminal_created_epoch=0
            local queued_ids=()
            local queued_shas=()
            local queued_created_epochs=()

            local run_entries
            run_entries="$(printf '%s' "$runs" | jq -r '.workflow_runs[] | @base64')"
            while IFS= read -r encoded; do
              [ -n "$encoded" ] || continue
              local run_json
              run_json="$(printf '%s' "$encoded" | base64 -d)"
              local run_id
              run_id="$(printf '%s' "$run_json" | jq -r '.id // empty')"
              local status
              status="$(printf '%s' "$run_json" | jq -r '.status // empty')"
              local head_sha
              head_sha="$(printf '%s' "$run_json" | jq -r '.head_sha // empty')"
              local updated
              updated="$(printf '%s' "$run_json" | jq -r '.updated_at // .created_at // empty')"
              local created
              created="$(printf '%s' "$run_json" | jq -r '.created_at // empty')"
              local updated_epoch
              updated_epoch="$(date -d "$updated" +%s 2>/dev/null || echo 0)"
              local created_epoch
              created_epoch="$(date -d "$created" +%s 2>/dev/null || echo 0)"
              [ -n "$run_id" ] || continue

              if [ "$status" = "in_progress" ]; then
                if [ -z "$active_run_id" ] || [ "$updated_epoch" -lt "$active_updated_epoch" ]; then
                  active_run_id="$run_id"
                  active_head_sha="$head_sha"
                  active_updated_epoch="$updated_epoch"
                  local run_started
                  run_started="$(printf '%s' "$run_json" | jq -r '.run_started_at // .created_at // empty')"
                  active_run_started_epoch="$(date -d "$run_started" +%s 2>/dev/null || echo 0)"
                fi
              elif [ "$status" = "queued" ] || [ "$status" = "pending" ]; then
                queued_ids+=( "$run_id" )
                queued_shas+=( "$head_sha" )
                queued_created_epochs+=( "$created_epoch" )
              elif [ "$status" = "completed" ]; then
                terminal_run_number="$(printf '%s' "$run_json" | jq -r '.run_number // 0')"
                if [ "$terminal_run_number" -gt "$latest_terminal_run_number" ]; then
                  latest_terminal_id="$run_id"
                  latest_terminal_run_number="$terminal_run_number"
                  latest_terminal_attempt="$(printf '%s' "$run_json" | jq -r '.run_attempt // 1')"
                  latest_terminal_conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion // empty')"
                  latest_terminal_head_sha="$head_sha"
                  latest_terminal_created_epoch="$created_epoch"
                fi
              fi
            done <<< "$run_entries"

            # A cancelled Research validation can otherwise become a permanent dead-end:
            # status reconciliation records the terminal state, while the normal queue/active
            # watchdog path has nothing left to recover. Recover exactly one such cancellation
            # by dispatching a fresh current-main validation, but only when no active/queued run
            # exists, the cancelled run is the latest terminal Research run, and the cancelled
            # run is either current-main or differs from current-main only through control-plane
            # changes. A 60-minute cooldown suppresses cancellation storms.
            if [ -z "$active_run_id" ] && [ "${#queued_ids[@]}" -eq 0 ] &&
               [ -n "$latest_terminal_id" ] &&
               [ "$latest_terminal_conclusion" = "cancelled" ] &&
               [ "$latest_terminal_attempt" -eq 1 ] &&
               [ "$latest_terminal_created_epoch" -gt 0 ] &&
               [ "$latest_terminal_created_epoch" -le "$((now_epoch - 60 * 60))" ]; then
              local cancellation_evidence_state=1
              if evidence_diff_state "$latest_terminal_head_sha"; then
                cancellation_evidence_state=0
              else
                cancellation_evidence_state=$?
              fi
              if [ "$cancellation_evidence_state" -eq 0 ]; then
                echo "::warning title=${workflow_name} cancelled-run recovery::latest Research run $latest_terminal_id was cancelled without evidence-affecting changes; dispatching bounded current-main recovery"
                if gh workflow run "$workflow_file" --repo "$GITHUB_REPOSITORY" --ref main; then
                  echo "${workflow_name}: bounded cancellation recovery dispatched on current main"
                  recovery_needed=true
                else
                  echo "::error title=${workflow_name} cancelled-run recovery failed::unable to dispatch current-main recovery"
                  failures=$((failures + 1))
                fi
              elif [ "$cancellation_evidence_state" -eq 2 ]; then
                echo "::error title=${workflow_name} cancelled-run recovery unverifiable::unable to compare cancelled run $latest_terminal_head_sha with current main $current_sha; failing closed"
                failures=$((failures + 1))
              else
                echo "${workflow_name}: cancelled latest run has evidence-affecting changes; awaiting Repository verification/autopilot"
              fi
            fi
            if [ -n "$active_run_id" ]; then
              # Preserve an active chronological OOS across control-plane-only main changes.
              # Evidence-affecting changes invalidate the run and must release the concurrency
              # lane for fresh OOS on current main. This mirrors the evidence fingerprint scope.
              local active_evidence_state=1
              if evidence_diff_state "$active_head_sha"; then
                active_evidence_state=0
              else
                active_evidence_state=$?
              fi
              if [ "$active_evidence_state" -eq 0 ]; then
                echo "::warning title=${workflow_name} evidence invalidation::active run $active_run_id targets $active_head_sha and current main has evidence-affecting changes; cancelling stale OOS before fresh validation"
                if gh run cancel "$active_run_id" --repo "$GITHUB_REPOSITORY"; then
                  echo "${workflow_name}: evidence-invalidated active run $active_run_id cancelled"
                  active_run_id=""
                  recovery_needed=true
                else
                  echo "::error title=${workflow_name} evidence invalidation recovery failed::unable to cancel invalidated run $active_run_id"
                  failures=$((failures + 1))
                  return 0
                fi
              elif [ "$active_evidence_state" -eq 2 ]; then
                echo "::error title=${workflow_name} evidence ancestry unverifiable::unable to compare active run $active_head_sha with current main $current_sha; preserving run under bounded stale guards"
              elif [ "$active_updated_epoch" -gt 0 ] && [ "$active_updated_epoch" -lt "$research_inactive_epoch" ]; then
                echo "::warning title=Research validation inactive active run::run $active_run_id has had no Actions update for over 120 minutes; cancelling stalled OOS"
                if gh run cancel "$active_run_id" --repo "$GITHUB_REPOSITORY"; then
                  echo "Research validation: stalled active run $active_run_id cancelled by inactivity guard"
                  active_run_id=""
                  recovery_needed=true
                else
                  echo "::error title=Research validation stalled active recovery failed::unable to cancel stalled run $active_run_id"
                  failures=$((failures + 1))
                  return 0
                fi
              elif [ "$active_run_started_epoch" -gt 0 ] && [ "$active_run_started_epoch" -lt "$research_stale_epoch" ]; then
                echo "::warning title=${workflow_name} stale active run::run $active_run_id has exceeded 350 minutes of active age; cancelling before Actions timeout"
                if gh run cancel "$active_run_id" --repo "$GITHUB_REPOSITORY"; then
                  echo "${workflow_name}: stale active run $active_run_id cancelled by hard-age guard"
                else
                  echo "::error title=${workflow_name} stale active recovery failed::unable to cancel stale run $active_run_id"
                  failures=$((failures + 1))
                  return 0
                fi
                active_run_id=""
                recovery_needed=true
              else
                # Keep the active chronological OOS run, but continue into queue
                # cleanup so stale queue entries do not become the next blocker.
                echo "WATCHDOG_RESEARCH workflow=${workflow_name} active_run=$active_run_id head_sha=$active_head_sha current_sha=$current_sha started_epoch=$active_run_started_epoch"
              fi
            fi
            local current_sha_queued=false
            local idx
            for idx in "${!queued_ids[@]}"; do
              local run_id="${queued_ids[$idx]}"
              local head_sha="${queued_shas[$idx]}"
              local created_epoch="${queued_created_epochs[$idx]}"
              local should_cancel=false

              if [[ "$head_sha" != "$current_sha" ]]; then
                should_cancel=true
                echo "::warning title=${workflow_name} stale queued SHA::queued run $run_id targets superseded SHA $head_sha; current=$current_sha"
              else
                current_sha_queued=true
              fi
              if [ "$should_cancel" = false ] && [ "$head_sha" = "$current_sha" ] && [ "$created_epoch" -gt 0 ] && [ "$created_epoch" -lt "$queued_cutoff_epoch" ]; then
                should_cancel=true
                echo "::warning title=${workflow_name} stale queued run::current-SHA run $run_id has remained queued for over 30 minutes"
              fi

              if [ "$should_cancel" = true ]; then
                if gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"; then
                  recovery_needed=true
                  echo "${workflow_name}: stale queued run $run_id cancelled"
                else
                  echo "::error title=${workflow_name} queued recovery cancel failed::unable to cancel stale queued run $run_id"
                  failures=$((failures + 1))
                fi
              fi
            done

            if [ "$recovery_needed" = true ]; then
              if [ "$current_sha_queued" = true ]; then
                echo "${workflow_name}: current-SHA queued run already exists after stale queue cleanup; suppressing duplicate dispatch"
              elif gh workflow run "$workflow_file" --repo "$GITHUB_REPOSITORY" --ref main; then
                echo "${workflow_name}: fresh main-branch run dispatched after stale queue cleanup"
              else
                echo "::error title=${workflow_name} queued recovery dispatch failed::unable to dispatch fresh main-branch run"
                failures=$((failures + 1))
              fi
            else
              echo "${workflow_name}: no stale queued run requiring recovery"
            fi
          }

          # Research validation intentionally preserves an active chronological
          # OOS run. Recover only stale active runs near their hard timeout, but
          # still remove queued runs targeting superseded SHAs so the next run
          # cannot execute stale research after the active OOS completes.
          inspect_research_validation

          recover_missing_scheduled_run() {
            local workflow_file="$1"
            local workflow_name="$2"
            local due_hhmm="$3"
            local grace_minutes="$4"
            local current_date
            current_date="$(TZ=Asia/Tokyo date '+%Y-%m-%d')"
            local weekday
            weekday="$(TZ=Asia/Tokyo date '+%u')"
            [ "$weekday" -le 5 ] || return 0

            local due_epoch now_epoch
            due_epoch="$(TZ=Asia/Tokyo date -d "$current_date $due_hhmm" +%s 2>/dev/null || echo 0)"
            now_epoch="$(date -u +%s)"
            [ "$due_epoch" -gt 0 ] || return 0
            [ "$now_epoch" -ge "$((due_epoch + grace_minutes * 60))" ] || return 0

            local runs
            if ! runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?per_page=20" 2>/dev/null)"; then
              echo "::error title=${workflow_name} scheduled-run API unavailable::unable to verify whether today's scheduled run exists"
              failures=$((failures + 1))
              return 0
            fi

            local active_blocking=false
            local active_entries
            active_entries="$(printf '%s' "$runs" | jq -r '.workflow_runs[] | select(.status == "queued" or .status == "pending" or .status == "in_progress") | @base64')"
            while IFS= read -r encoded; do
              [ -n "$encoded" ] || continue
              run_json="$(printf '%s' "$encoded" | base64 -d)"
              status="$(printf '%s' "$run_json" | jq -r '.status // empty')"
              run_id="$(printf '%s' "$run_json" | jq -r '.id // empty')"
              updated="$(printf '%s' "$run_json" | jq -r '.updated_at // .created_at // empty')"
              updated_epoch="$(date -d "$updated" +%s 2>/dev/null || echo 0)"
              stale=false
              if { [ "$status" = "queued" ] || [ "$status" = "pending" ]; } && [ "$updated_epoch" -gt 0 ] && [ "$updated_epoch" -lt "$queued_cutoff" ]; then
                stale=true
              elif [ "$status" = "in_progress" ] && [ "$updated_epoch" -gt 0 ] && [ "$updated_epoch" -lt "$stale_cutoff" ]; then
                stale=true
              fi
              if [ "$stale" = true ]; then
                echo "::warning title=${workflow_name} stale active run::run $run_id ($status) has exceeded the recovery age; cancelling before scheduled recovery"
                if gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY"; then
                  echo "$workflow_name: stale active run $run_id cancelled"
                else
                  echo "::error title=${workflow_name} stale active recovery failed::unable to cancel stale run $run_id"
                  failures=$((failures + 1))
                  active_blocking=true
                fi
              else
                active_blocking=true
              fi
            done <<< "$active_entries"
            if [ "$active_blocking" = true ]; then
              echo "${workflow_name}: scheduled recovery suppressed; a fresh active run exists or stale-run cancellation failed"
              return 0
            fi

            local today_start_epoch current_today
            today_start_epoch="$(TZ=Asia/Tokyo date -d "$current_date 00:00:00" +%s 2>/dev/null || echo 0)"
            [ "$today_start_epoch" -gt 0 ] || return 0
            current_today="$(printf '%s' "$runs" | jq --arg sha "$current_sha" --argjson start "$today_start_epoch" '[.workflow_runs[] | select(.head_sha == $sha) | select((.created_at | fromdateiso8601) >= $start)] | length')"
            if [ "$current_today" -gt 0 ]; then
              echo "${workflow_name}: today's current-SHA scheduled run already exists"
              return 0
            fi

            if gh workflow run "$workflow_file" --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "$workflow_name: missing scheduled run recovered on main"
            else
              echo "::error title=${workflow_name} scheduled recovery dispatch failed::unable to dispatch missing scheduled run"
              failures=$((failures + 1))
            fi
          }

          # Recover only after the expected scheduled window, only on weekdays,
          # and never while another run for the same workflow is active.
          recover_missing_scheduled_run "us-close-prediction.yml" "U.S. close prediction" "07:17" 30
          recover_missing_scheduled_run "prediction-monitoring.yml" "Prediction monitoring" "09:27" 30
          recover_missing_scheduled_run "market-cycle.yml" "Market cycle" "18:37" 30

          # Controller heartbeats close the remaining automation gap: GitHub Actions can
          # silently miss a scheduled invocation without leaving a queued/failed run for the
          # generic watchdog to repair. These bounded checks only recover the controller when
          # no run is active and no current-main run exists within a conservative cadence window.
          # They never alter production evidence gates or cancel legitimate active research.
          recover_missing_periodic_controller() {
            local workflow_file="$1"
            local workflow_name="$2"
            local cadence_minutes="$3"
            local max_age_minutes="$4"
            local now_epoch
            now_epoch="$(date -u +%s)"
            local recent_cutoff_epoch
            recent_cutoff_epoch="$((now_epoch - max_age_minutes * 60))"
            local runs
            if ! runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs?branch=main&per_page=20" 2>/dev/null)"; then
              echo "::error title=${workflow_name} controller-heartbeat API unavailable::unable to verify controller cadence"
              failures=$((failures + 1))
              return 0
            fi

            local active_found=false
            local recent_current_found=false
            while IFS= read -r encoded; do
              [ -n "$encoded" ] || continue
              local run_json
              run_json="$(printf '%s' "$encoded" | base64 -d)"
              local status
              status="$(printf '%s' "$run_json" | jq -r '.status // empty')"
              local created
              created="$(printf '%s' "$run_json" | jq -r '.created_at // empty')"
              local created_epoch
              created_epoch="$(date -d "$created" +%s 2>/dev/null || echo 0)"
              local head_sha
              head_sha="$(printf '%s' "$run_json" | jq -r '.head_sha // empty')"

              if [ "$status" = "queued" ] || [ "$status" = "pending" ] || [ "$status" = "in_progress" ]; then
                active_found=true
                continue
              fi
              if [ "$head_sha" = "$current_sha" ] && [ "$created_epoch" -ge "$recent_cutoff_epoch" ]; then
                recent_current_found=true
              fi
            done < <(printf '%s' "$runs" | jq -r '.workflow_runs[] | @base64')

            if [ "$active_found" = true ]; then
              echo "${workflow_name}: active run exists; controller heartbeat recovery suppressed"
              return 0
            fi
            if [ "$recent_current_found" = true ]; then
              echo "${workflow_name}: current-main controller run is within cadence window (cadence=${cadence_minutes}m max_age=${max_age_minutes}m)"
              return 0
            fi

            echo "::warning title=${workflow_name} controller heartbeat gap::no current-main run within cadence window; dispatching bounded recovery"
            if gh workflow run "$workflow_file" --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "${workflow_name}: missing controller heartbeat recovered on main"
            else
              echo "::error title=${workflow_name} controller heartbeat recovery failed::unable to dispatch current-main controller run"
              failures=$((failures + 1))
            fi
          }

          dispatch_heartbeat_recovery() {
            local attempt
            for attempt in 1 2 3; do
              if gh workflow run heartbeat.yml --repo "$GITHUB_REPOSITORY" --ref main; then
                echo "Automation heartbeat: recovery dispatched on main (attempt ${attempt}/3)"
                return 0
              fi
              sleep $((attempt * 3))
            done
            echo "::error title=Automation heartbeat recovery dispatch failed::bounded heartbeat dispatch retries exhausted"
            return 1
          }

          # Keep the independent supervisor and the three control-plane loops alive even when a scheduled trigger
          # is missed before GitHub creates a run record. Conservative cadence windows avoid duplicate executions
          # while still recovering genuine scheduler gaps.
          recover_missing_periodic_controller "automation-supervisor.yml" "Automation supervisor" 10 45
          recover_missing_periodic_controller "research-autopilot.yml" "Research autopilot" 30 120
          recover_missing_periodic_controller "long-research-recovery.yml" "Long research recovery" 10 45
          recover_missing_periodic_controller "automation-failure-learning.yml" "Automation failure learning" 15 75

          if ! heartbeat_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/heartbeat.yml/runs?status=success&per_page=1" 2>/dev/null)"; then
            echo "::error title=Automation heartbeat API unavailable::unable to inspect successful heartbeat runs"
            failures=$((failures + 1))
          else
            latest_heartbeat="$(printf '%s' "$heartbeat_runs" | jq -r '.workflow_runs[0].created_at // empty')"
            if [ -z "$latest_heartbeat" ]; then
              echo "::warning title=Automation heartbeat missing::no successful heartbeat run is available; dispatching bounded recovery"
              if ! dispatch_heartbeat_recovery; then
                failures=$((failures + 1))
              fi
            else
              heartbeat_epoch="$(date -d "$latest_heartbeat" +%s 2>/dev/null || echo 0)"
              # Heartbeat runs every 6h. Allow one missed schedule plus runner/API delay;
              # recover automatically only after the 13h stale boundary.
              heartbeat_cutoff="$(date -u -d '13 hours ago' +%s)"
              if [ "$heartbeat_epoch" -le 0 ] || [ "$heartbeat_epoch" -lt "$heartbeat_cutoff" ]; then
                echo "::warning title=Automation heartbeat stale::latest successful heartbeat is older than 13 hours: $latest_heartbeat"
                if ! dispatch_heartbeat_recovery; then
                  failures=$((failures + 1))
                fi
              else
                echo "Automation heartbeat: fresh ($latest_heartbeat)"
              fi
            fi
          fi

          if [ "$failures" -gt 0 ]; then
            echo "Actions reliability watchdog: FAIL (${failures} unresolved workflow failure(s))"
            exit 1
          fi

          echo "Actions reliability watchdog: PASS"
