name: Market cycle

on:
  workflow_dispatch:
  schedule:
    # Canonical daily run. The reliability watchdog recovers a missed run
    # after the grace window, so a second scheduled run is unnecessary and
    # would only create avoidable queued/cancelled executions.
    - cron: "37 18 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  actions: read
  contents: write

concurrency:
  group: market-cycle
  # Never cancel an expensive market/research cycle mid-run. The prepare
  # guard rejects superseded SHAs and prevents duplicate work safely.
  cancel-in-progress: false

jobs:
  prepare-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_required: ${{ steps.guard.outputs.run_required }}
    steps:
      - name: Avoid duplicate scheduled cycles
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Manual/recovery dispatches use the same duplicate and stale-SHA
          # guard as scheduled/push executions. Never bypass the run gate.
          if ! runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/market-cycle.yml/runs?per_page=20" 2>/dev/null)"; then
            echo "run_required=false" >> "$GITHUB_OUTPUT"
            echo "guard_reason=actions_api_unavailable_defer" >> "$GITHUB_OUTPUT"
            echo "market-cycle guard: Actions API unavailable; deferring cycle fail-closed"
            exit 0
          fi
          if [ -z "$runs" ]; then
            echo "run_required=false" >> "$GITHUB_OUTPUT"
            echo "guard_reason=actions_api_empty_response_defer" >> "$GITHUB_OUTPUT"
            echo "market-cycle guard: Actions API returned empty response; deferring cycle fail-closed"
            exit 0
          fi
          now="$(date -u +%s)"
          current_sha="$GITHUB_SHA"
          run_required=true
          reason="no_recent_cycle"

          if ! branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq ".object.sha")"; then
            echo "market-cycle guard: unable to resolve current main SHA; deferring cycle fail-closed"
            run_required=false
            reason="current_main_sha_unavailable"
          elif [ "$branch_sha" != "$current_sha" ]; then
            echo "market-cycle guard: superseded workflow SHA=$current_sha current_main=$branch_sha; deferring stale cycle"
            run_required=false
            reason="superseded_workflow_sha"
          fi
          if [ "$run_required" = false ]; then
            echo "run_required=$run_required" >> "$GITHUB_OUTPUT"
            echo "guard_reason=$reason" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            run_json="$(printf "%s" "$encoded" | base64 -d)"
            run_id="$(printf "%s" "$run_json" | jq -r ".id")"
            # A newer run may already exist because GitHub can enqueue a scheduled/manual trigger
            # while this guard is starting. It must never suppress the current run; only older
            # executions are eligible to act as duplicate/stale blockers.
            if [ "$run_id" -gt "$GITHUB_RUN_ID" ]; then
              continue
            fi
            [ "$run_id" = "${{ github.run_id }}" ] && continue
            created="$(printf "%s" "$run_json" | jq -r ".created_at // empty")"
            [ -n "$created" ] || continue
            created_epoch="$(date -d "$created" +%s 2>/dev/null || echo 0)"
            [ "$created_epoch" -gt 0 ] || continue
            age="$((now - created_epoch))"
            [ "$age" -ge 0 ] && [ "$age" -le 5400 ] || continue
            status="$(printf "%s" "$run_json" | jq -r ".status // empty")"
            conclusion="$(printf "%s" "$run_json" | jq -r ".conclusion // empty")"
            head_sha="$(printf "%s" "$run_json" | jq -r ".head_sha // empty")"

            # Never overlap with any recent cycle, regardless of SHA.
            # This prevents two expensive price/research cycles from running
            # concurrently after back-to-back production-code commits.
            if [ "$status" = "queued" ] || [ "$status" = "in_progress" ]; then
              run_required=false
              reason="recent_cycle_${status}"
              break
            fi

            # A completed run from a superseded SHA must not suppress a fresh
            # cycle for the current production code.
            if [ "$head_sha" != "$current_sha" ]; then
              continue
            fi

            if [ "$conclusion" = "success" ]; then
              run_required=false
              reason="recent_successful_current_sha_cycle"
              break
            fi
          done < <(printf "%s" "$runs" | jq -r ".workflow_runs[] | @base64")
          echo "run_required=$run_required" >> "$GITHUB_OUTPUT"
          echo "guard_reason=$reason" >> "$GITHUB_OUTPUT"
          echo "market-cycle guard: run_required=$run_required reason=$reason"

  refresh-universe:
    if: needs.prepare-cycle.outputs.run_required == 'true'
    needs: prepare-cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/refresh_universe.py
      - uses: actions/upload-artifact@v7
        with:
          name: universe-${{ github.run_id }}
          path: data/universe/latest.json
          retention-days: 7

  price-shards:
    if: needs.prepare-cycle.outputs.run_required == 'true'
    needs: [prepare-cycle, refresh-universe]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/download-artifact@v7
        with:
          name: universe-${{ github.run_id }}
          path: data/universe
      - name: Restore previous price state
        env:
          PRICE_SHARD_INDEX: ${{ matrix.shard }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/restore_latest_price_state.py
      - name: Update assigned price shard
        env:
          PRICE_SHARD_INDEX: ${{ matrix.shard }}
          PRICE_SHARD_COUNT: 4
          PRICE_MAX_WORKERS: 2
        run: python scripts/update_prices.py
      - uses: actions/upload-artifact@v7
        with:
          name: price-state-shard-${{ matrix.shard }}
          path: data/prices/
          retention-days: 7

  research-and-gate:
    if: needs.prepare-cycle.outputs.run_required == 'true'
    needs: [prepare-cycle, price-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[research]"
      - uses: actions/download-artifact@v7
        with:
          pattern: price-state-shard-*
          path: data/prices
          merge-multiple: true
      - name: Restore current-cycle universe
        uses: actions/download-artifact@v7
        with:
          name: universe-${{ github.run_id }}
          path: data/universe
      - name: Update free market context
        run: python scripts/update_market_context.py
      - name: PayPay master catalog integrity
        run: python scripts/catalog_integrity.py
      - name: Canonicalize price store
        run: python scripts/normalize_price_store.py
      - name: Universe quality gate
        run: python scripts/universe_quality_gate.py
      - name: Price data quality gate
        run: python scripts/data_quality_gate.py
      - name: Independent raw-input PIT leakage audit
        run: python scripts/run_independent_leakage_audit.py
      - name: Bootstrap immutable frozen holdout
        run: python scripts/bootstrap_frozen_holdout.py
      - name: Chronological OOS research
        run: python scripts/run_daily_research.py
      - name: Collect free SEC filing research inputs
        run: python scripts/sec_filings_research.py

      - name: Run SEC filing OOS challenger ablation
        run: python scripts/run_sec_filing_ablation.py

      - name: Lock model routing
        run: python scripts/lock_frozen_model.py
      - name: One-time frozen holdout evaluation
        run: python scripts/evaluate_frozen_holdout.py
      - name: Build reproducibility manifest
        run: python scripts/build_manifest.py
      - name: Release gate
        id: gate
        shell: bash
        run: |
          python scripts/release_gate.py
          approved=$(python -c 'import json; print(str(json.load(open("data/research/release_gate.json")).get("approved",False)).lower())')
          echo "approved=$approved" >> "$GITHUB_OUTPUT"
      - name: Build immutable production model artifact
        if: steps.gate.outputs.approved == 'true'
        run: python scripts/build_production_artifact.py
      - name: Restore latest live monitoring state
        if: steps.gate.outputs.approved == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/restore_latest_monitor_state.py
      - name: Live performance gate
        id: live_gate
        if: steps.gate.outputs.approved == 'true'
        run: python scripts/live_performance_gate.py
      - name: Production prediction
        if: steps.gate.outputs.approved == 'true' && steps.live_gate.outputs.allowed == 'true'
        env:
          PREDICT_ASSET_CLASSES: jp_stock,jp_etf,jp_reit
        run: python scripts/run_daily_prediction.py
      - name: Validate production prediction output
        if: steps.gate.outputs.approved == 'true' && steps.live_gate.outputs.allowed == 'true'
        run: python scripts/validate_prediction_output.py
      - name: Cross-sectional backtest evidence
        if: steps.gate.outputs.approved == 'true'
        run: python scripts/run_backtest.py
      - name: Explicitly record deferred production state
        if: steps.gate.outputs.approved != 'true' || steps.live_gate.outputs.allowed != 'true'
        run: echo "Production prediction DEFERRED by release gate."
      - uses: actions/upload-artifact@v7
        with:
          name: research-cycle-${{ github.run_id }}
          path: |
            data/
            config/frozen_holdout.json
          retention-days: 7
      - name: Persist lightweight cycle manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p artifacts
          date -u +"%Y-%m-%dT%H:%M:%SZ" > artifacts/last_cycle.txt
          cp data/research/release_gate.json artifacts/release_gate.json
          if [ -f config/frozen_holdout.json ]; then
            cp config/frozen_holdout.json artifacts/frozen_holdout.json
          fi
          if [ -f data/research/frozen_holdout_result.json ]; then
            cp data/research/frozen_holdout_result.json artifacts/frozen_holdout_result.json
          fi
          git add artifacts/ data/research/release_gate.json
          if [ -f config/frozen_holdout.json ]; then git add config/frozen_holdout.json; fi
          if [ -f data/research/frozen_holdout_result.json ]; then git add data/research/frozen_holdout_result.json; fi
          git diff --cached --quiet || git commit -m "Persist frozen release state"
          git push