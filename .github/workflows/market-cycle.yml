name: Market cycle

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: market-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Refresh authoritative universe
        run: python scripts/refresh_universe.py
      - name: Incremental price update
        run: python scripts/update_prices.py
      - name: Chronological OOS research
        run: python scripts/run_daily_research.py
      - name: Build release-gate decision
        run: python scripts/release_gate.py
      - name: Production prediction only after approval
        run: python scripts/run_daily_prediction.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: market-cycle-${{ github.run_id }}
          path: data/
          retention-days: 7
      - name: Persist cycle manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p artifacts
          date -u +"%Y-%m-%dT%H:%M:%SZ" > artifacts/last_cycle.txt
          git add artifacts/last_cycle.txt
          git diff --cached --quiet || git commit -m "Record market cycle completion"
          git push
