name: Stale research run reaper

# Emergency control-plane lane. It deliberately shares the exact concurrency
# groups used by stale long-running research workflows so a queued job with
# cancel-in-progress=true can terminate obsolete runs without touching
# production prediction workflows.
on:
  push:
    paths:
      - "ops/reap_stale_research.trigger"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  marathon:
    runs-on: ubuntu-latest
    concurrency:
      group: research-marathon-v1
      cancel-in-progress: true
    steps:
      - name: Release obsolete research marathon lane
        run: echo "stale research marathon concurrency lane released"

  validation:
    runs-on: ubuntu-latest
    concurrency:
      group: research-validation-v4
      cancel-in-progress: true
    steps:
      - name: Release obsolete research validation lane
        run: echo "stale research validation concurrency lane released"
