name: Stale research marathon reaper

# Control-plane workflow. The workflow-level concurrency group intentionally
# matches the obsolete marathon group so a queued push can cancel the stale
# in-progress marathon before any runner allocation is needed.
on:
  push:
    paths:
      - "ops/reap_stale_research.trigger"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: research-marathon-v1
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: echo "stale research marathon lane released"
